"5.5.1", "text": "Sequence"}, {"t": "p", "text": "In the normal sequence of controls, exit procedures are completed before entry procedures. Under exceptional circumstances and without prejudice to the sequence of jurisdiction, the sequence of controls may be reversed. The lead agencies of the adjoining Partner States coordinate the varied sequence of controls ensuring the objectives of the OSBP under the Act are not compromised by such variations."}, {"t": "h", "id": "5.5.2", "text": "Release Priority"}, {"t": "p", "text": "As a rule, goods and vehicles of transport that qualify for the normal green lane/track are not to be subjected to inspection. As an exception, at the discretion of border officers charged with the control, based on risk assessment, random sampling and reference for intensive and detailed inspection may be applied."}, {"t": "h", "id": "5.5.3", "text": "Incidents"}, {"t": "p", "text": "The following possible incidents warrant the measures and preventive actions indicated:"}, {"t": "li", "mk": "1", "lv": 1, "text": "Persons"}, {"t": "li", "mk": "i", "lv": 2, "text": "persons denied entry by the Partner State of destination or who from entry, shall be redirected to the Partner State of exit or as shall be determined by the officer supervising the movement in accordance with the applicable law;"}, {"t": "li", "mk": "ii", "lv": 2, "text": "persons awaiting further examination shall stay in the rooms and areas of the control zone designated for that purpose;"}, {"t": "li", "mk": "iii", "lv": 2, "text": "persons not meeting international and national recommended vaccination and prophylactic health measures shall be treated according to host state health requirements and the recommendation of the International Health Regulations, 2005, of the World Health Organization;"}, {"t": "li", "mk": "iv", "lv": 2, "text": "persons showing symptoms of infectious disease shall be isolated for observation and transferred to the designated facility for isolation and observation;"}, {"t": "li", "mk": "v", "lv": 2, "text": "persons in need of medical care/treatment shall be administered first aid in the sick bay and if required be taken to the nearest medical facility; and"}, {"t": "li", "mk": "vi", "lv": 2, "text": "suspected or arrested offenders shall be transferred to the arresting officer’s state, as per the Act."}, {"t": "li", "mk": "2", "lv": 1, "text": "Means of Transport"}, {"t": "li", "mk": "i", "lv": 2, "text": "means of transport denied entry by the Partner State of destination or that are withdrawn from entry, shall be redirected to the Partner State of exit or as shall be determined by the officer supervising the movement in accordance with the applicable law"}, {"t": "li", "mk": "ii", "lv": 2, "text": "means of transport, while awaiting further examination, shall remain in the area(s) of the control zone designated for that purpose;"}, {"t": "li", "mk": "iii", "lv": 2, "text": "impounded means of transport may be conveyed to the seizing officer’s Partner State."}, {"t": "li", "mk": "3", "lv": 1, "text": "Goods"}, {"t": "li", "mk": "i", "lv": 2, "text": "goods denied entry by the Partner State of destination or that are withdrawn from entry, shall be redirected to the Partner State of exit or as shall be determined by the officer supervising the movement in accordance with the applicable law"}, {"t": "li", "mk": "ii", "lv": 2, "text": "goods, while awaiting further examination, including sampling, screening, and scanning, shall remain in the area(s) of the control zone designated for that purpose;"}, {"t": "li", "mk": "iii", "lv": 2, "text": "seized goods may be conveyed to the seizing officer’s Partner State;"}, {"t": "li", "mk": "iv", "lv": 2, "text": "quarantined goods may be stored in designated areas in the exclusive area of the control zone;"}, {"t": "li", "mk": "ix", "lv": 2, "text": "live animals (domestic animals and wildlife) showing signs of disease shall be kept in holding pens for further examination for a specified period; and"}, {"t": "li", "mk": "x", "lv": 2, "text": "biological materials suspected of any infection or contamination should be kept in a designated area for further investigation or examination."}]}]}, {"n": 6, "title": "Conduct of Officers in the Control Zone", "sections": [{"id": "6.1", "title": "Conduct of Officers", "blocks": [{"t": "p", "text": "Officers operating at OSBPs at all times should be diplomatic, and exhibit decorum and respect, when interacting with counterparts and border users. Accordingly, the following measures should be taken into consideration:"}, {"t": "li", "mk": "1", "lv": 1, "text": "Each adjoining Partner State determines the standards of behavior it obliges its officers operating at an OSBP to comply with by way of a national code of conduct."}, {"t": "li", "mk": "2", "lv": 1, "text": "The national code of conduct or appropriate extract is availed to the other adjoining Partner State for purposes of harmonization and management of the behavior of officers of the two adjoining Partner States operating in the same control zone."}, {"t": "li", "mk": "3", "lv": 1, "text": "The lead agencies of the two adjoining Partner States harmonize for uniformity and consistency any aspects of the codes of conduct that may be in conflict with each other."}, {"t": "li", "mk": "4", "lv": 1, "text": "In addition to the provisions of the national codes of conduct, the officers of the adjoining Partner States at an OSBP shall adhere to the following common standards of behavior:"}, {"t": "li", "mk": "i", "lv": 2, "text": "Professionalism;"}, {"t": "li", "mk": "ii", "lv": 2, "text": "Integrity;"}, {"t": "li", "mk": "iii", "lv": 2, "text": "Adherence to procedures;"}, {"t": "li", "mk": "iv", "lv": 2, "text": "Observance of law and order;"}, {"t": "li", "mk": "v", "lv": 2, "text": "Wearing of official uniform and/or adhering to formal attire on duty; and"}, {"t": "li", "mk": "vi", "lv": 2, "text": "Respect for diversity."}]}, {"id": "6.2", "title": "Investigation and Prosecution of Officers", "blocks": [{"t": "li", "mk": "1", "lv": 1, "text": "An officer who is being investigated or prosecuted for the commission of an offence under Section 34 or 35 of the Act, should be suspended from duty by his or her home Partner State."}, {"t": "li", "mk": "2", "lv": 1, "text": "An officer who is cleared or acquitted of the accusation of having committed an offence under Section 34 or 35 of the Act, should have his or her suspension lifted by his or her home Partner State."}]}, {"id": "6.3", "title": "Civil Liability", "blocks": [{"t": "li", "mk": "1", "lv": 1, "text": "Personal Immunity"}, {"t": "p", "text": "An officer of one adjoining Partner State may not be liable for any act or omission in good faith in the exercise of his functions under the Act and the Regulations."}, {"t": "li", "mk": "2", "lv": 1, "text": "Vicarious Liability"}, {"t": "p", "text": "Notwithstanding the officer’s personal immunity, the sending Partner State or agency may be held liable for the acts or omissions of its officer done in good faith in the exercise of his/her functions under the Act or the Regulations."}]}]}, {"n": 7, "title": "Facilitation Agents and Other Service Providers in the Control Zone", "sections": [{"id": "7", "title": "Facilitation Agents and Other Service Providers in the Control Zone", "blocks": [{"t": "p", "text": "The procedural framework for the supply of services in a control zone situated in a foreign host Partner State is provided in this chapter."}]}, {"id": "7.1", "title": "Facilitation Agents", "blocks": [{"t": "h", "id": "7.1.1", "text": "Access to the Control Zone"}, {"t": "li", "mk": "1", "lv": 1, "text": "The facilitation agents access the control zone on the basis of an identification badge issued by the host Partner State authority. The facilitation agents may be called upon to pay a fee for the issuance of such identification badges."}, {"t": "li", "mk": "2", "lv": 1, "text": "In the absence of such identity badge, a facilitation agent may be given access to the control zone for official purposes by being positively identified by either the lead agency or a member of the facilitation agents association at the OSBP and shall be issued with a temporary badge."}, {"t": "li", "mk": "3", "lv": 1, "text": "For purposes of enhancing security within the control zone of an OSBP, any facilitation agents accessing the control zone for official functions passes through non-intrusive human security screening machines and devices as may be installed by the adjoining Partner States. In the context of such security screening measures, facilitation agents will not be allowed to take into the control zone the items as per the list agreed upon between the adjoining Partner States."}, {"t": "li", "mk": "4", "lv": 1, "text": "The number and names of the authorized facilitation agents are exchanged between the adjoining Partner States. The respective lead agencies maintain a list of facilitation agents. The list should be accessible for consultation by the competent authorities for the purpose of verification."}, {"t": "li", "mk": "5", "lv": 1, "text": "Each facilitation agent is issued with an official identification badge for use on the following terms and conditions:"}, {"t": "li", "mk": "i", "lv": 2, "text": "The facilitation agents visibly display at all times their officially issued identity badges as prescribed by the Act in the course of their provision of facilitation services for ease of identification by both members of the public undertaking their controls and border control officers of the two States. The essential particulars of the facilitation agent on the identity badge include the agent’s national flag, identity badge number, photograph, agent’s full names, name of the company, if any, to which the agent belongs, electronically readable access code and security features for badge verification purposes."}, {"t": "li", "mk": "ii", "lv": 2, "text": "In the event of an identity badge being lost or stolen or destroyed, such incident shall promptly be reported to the issuing authorities of both States who shall take measures to disable and block the badge from further use on any electronic access systems in place in the control zone."}, {"t": "li", "mk": "6", "lv": 1, "text": "Facilitation agents are encouraged to wear their company uniforms if applicable as a way of further enhancing ease of their identification. In all other cases, facilitation agents are at all times smartly dressed in civilian clothes as specified in a dress code by Community associations for portrayal of the right national image to the various publics utilizing the OSBP in conjunction with distinct reflective jackets on which the name of the company and or the name of the agent and registration number are permanently marked or embroidered or labelled at the back. The reflective jackets worn in this regard are clearly distinct from any other reflective jackets that may be worn by officers in the control zone as a safety measure."}, {"t": "li", "mk": "7", "lv": 1, "text": "Facilitation agents are licensed by their home Partner State on the basis of existing law and criteria."}, {"t": "h", "id": "7.1.2", "text": "Facilities to be Allocated"}, {"t": "li", "mk": "1", "lv": 1, "text": "A common facilitation and processing area is allocated to all the registered facilitation agents in the OSBP control zone. The common facility is appropriately equipped by the host Partner State or the associations and is available for use by the facilitation agents registered to operate at any such OSBP. Access to such facility is controlled and the systems installed at the facility are appropriately linked to official border control systems to enable electronic lodgment of documents and data and access to information on the official border control systems as may be authorized."}, {"t": "li", "mk": "2", "lv": 1, "text": "The facility may be allocated to the facilitation agents on a rental basis as may be determined by the adjoining Partner States on a cost recovery basis. Such cost recovery may also be applicable to any utilities and amenities such as electricity, water, cleaning services, etc., provided by the Host State."}, {"t": "h", "id": "7.1.3", "text": "Movement of Equipment"}, {"t": "li", "mk": "1", "lv": 1, "text": "Subject to proper declaration and inventory, equipment required for rendering the services of the facilitation agents in the host Partner State control zone may be moved freely into and out of the control zone and exempt from import/export customs duties."}, {"t": "li", "mk": "2", "lv": 1, "text": "Subsection 8.2.2 of the Procedures Manual applies mutatis mutandis (the necessary changes having been made) to all equipment brought into the control zone by facilitation agents for their official use in provision of facilitation services."}, {"t": "h", "id": "7.1.4", "text": "Repatriation of Proceeds of Business Activity"}, {"t": "p", "text": "Subject to the exchange control laws and regulations of each Partner State, facilitation agents may repatriate to their home Partner States any monies generated by the provision of their services."}, {"t": "h", "id": "7.1.5", "text": "Communications Link"}, {"t": "li", "mk": "1", "lv": 1, "text": "Communication with Home Partner States"}, {"t": "p", "text": "Facilitation agents are permitted to set up a communication link with their home Partner States."}, {"t": "li", "mk": "2", "lv": 1, "text": "Access to Electronic Control Systems"}, {"t": "li", "mk": "i", "lv": 2, "text": "Each facilitation agent operating at an OSBP should be appropriately trained and allocated credentials by the relevant authority for purposes of authorized and secure access to the official electronic control and other systems as may be available for electronic clearance of goods, persons and services."}, {"t": "li", "mk": "ii", "lv": 2, "text": "The facilitation agents’ electronic lodgment systems are appropriately and securely interfaced with all relevant official control systems for ease of electronic access to such systems. The official control systems fully define the levels of data access that facilitation agencies may have and outline the procedures to be used for electronic lodgment or such access of information."}, {"t": "li", "mk": "iii", "lv": 2, "text": "The lead agency is responsible for the administration and maintenance of systems used by facilitation agents associations and ensures effective and uninterrupted availability of connectivity at all times."}, {"t": "h", "id": "7.1.6", "text": "Applicable Law"}, {"t": "p", "text": "In the exercise of his/her functions, the facilitation agent is subject to the host Partner State laws in the control zone. The contractual relationship with the user for the provision of the services of the facilitation agent is governed by the facilitation agent’s home Partner State’s national laws."}]}, {"id": "7.2", "title": "Other Service Providers", "blocks": [{"t": "h", "id": "7.2.1", "text": "Access to the Control Zone"}, {"t": "li", "mk": "1", "lv": 1, "text": "Other authorized service providers (e.g., banks, foreign exchange bureaus, food and beverage caterers) may access the control zone for the purpose of providing their products and services, on the basis of an identification badge and authorization of operation in the control zone issued by the host Partner State authority. The loss or theft of identification badges and any other incidents occurring in their premises or during the course of operation shall immediately be reported to the lead agencies for remedial action."}, {"t": "li", "mk": "2", "lv": 1, "text": "The names and details of these other authorized service providers are exchanged between the adjoining Partner States. The respective lead agencies maintain a list of these authorized service providers. The list should be accessible for consultation by the competent authorities for the purpose of verification."}, {"t": "li", "mk": "3", "lv": 1, "text": "These authorized service providers are licensed by their home Partner State on the basis of existing law and criteria."}, {"t": "h", "id": "7.2.2", "text": "Movement of Equipment"}, {"t": "p", "text": "Subsection 7.1.3 also applies to the movement of equipment of other service providers."}, {"t": "h", "id": "7.2.3", "text": "Allocation of Space and Facilities"}, {"t": "p", "text": "Suitable space and facilities may be allocated to the service providers on a rental, cost recovery basis, subject to availability."}, {"t": "h", "id": "7.2.4", "text": "Repatriation of Proceeds of Business Activity"}, {"t": "p", "text": "Subsection 7.1.4 also applies to the repatriation of proceeds of other service providers."}, {"t": "h", "id": "7.2.5", "text": "Communications Link"}, {"t": "p", "text": "Service providers are permitted to set up a communication link with their home Partner States."}, {"t": "h", "id": "7.2.6", "text": "Applicable Law"}, {"t": "p", "text": "Subsection 7.1.6 also applies regarding applicable law for the exercise of functions by other service providers."}]}]}, {"n": 8, "title": "Jurisdiction", "sections": [{"id": "8.1", "title": "Jurisdiction", "blocks": [{"t": "h", "id": "8.1.1", "text": "Sequence of Jurisdiction"}, {"t": "p", "text": "The Partner State of exit exercises its jurisdiction before the Partner State of entry. Despite having conducted its controls jointly with the Partner State of exit, the Partner State of entry shall not take any measures on the person or goods before the Partner State of exit has completed its measures and handed over jurisdiction in the appropriate manner."}, {"t": "h", "id": "8.1.2", "text": "Exercise of Jurisdiction"}, {"t": "li", "mk": "1", "lv": 1, "text": "The jurisdiction (including criminal jurisdiction) of the Partner State of exit precedes that of the Partner State of entry and such jurisdiction includes ability by the adjoining Partner States to take any measures and action that are permissible under each Partner State’s national laws."}, {"t": "li", "mk": "2", "lv": 1, "text": "The handover of jurisdiction from the Partner State of exit to the Partner State of entry is established by way of and in the form of an official stamp on the control documents or gate pass or electronic release or handover of control documents to officers of the Partner State of entry, or in any other unequivocal modality."}, {"t": "li", "mk": "3", "lv": 1, "text": "The jurisdiction of the State of entry takes effect immediately upon such handover."}, {"t": "li", "mk": "4", "lv": 1, "text": "Where the Partner State of exit, after having handed over jurisdiction to the Partner State of entry, wishes to reclaim its jurisdiction for compelling reasons, it shall communicate its request and the reasons for the request to the Partner State of entry."}, {"t": "li", "mk": "5", "lv": 1, "text": "Such request is filed through the lead agencies of the Adjoining Partner States."}, {"t": "li", "mk": "6", "lv": 1, "text": "The lead agency of the Partner State of entry gives due consideration to the request and the reasons given and undertakes any consultations with its other national border agencies or higher national authorities as may be necessary and in its sole discretion grant or deny the request."}, {"t": "li", "mk": "7", "lv": 1, "text": "In cases where the request is granted, the persons or goods subject to the request shall be conveyed to the Partner State of exit by the Partner State of entry and further controls of the Partner State of exit may be undertaken.,"}]}, {"id": "8.2", "title": "Extraterritorial Jurisdiction", "blocks": [{"t": "p", "text": "This section sets out procedures related to extraterritoriality, which allows officers to work in the adjoining Partner State."}, {"t": "h", "id": "8.2.1", "text": "Identification of Officers Performing Extraterritorial Duties"}, {"t": "li", "mk": "1", "lv": 1, "text": "The details of the officers from the adjoining states performing extraterritorial duties are shared through their respective lead agencies. The list is to be amended by a Partner State as necessary and the amendment(s) communicated by the lead agency to the adjoining Partner State."}, {"t": "li", "mk": "2", "lv": 1, "text": "Badges"}, {"t": "li", "mk": "i", "lv": 2, "text": "The officers of both Partner States visibly display at all times their officially issued identity badges as prescribed by the Act in the course of conduct of border controls for ease of identification."}, {"t": "li", "mk": "ii", "lv": 2, "text": "The essential particulars of the officer on the identity badge include:"}, {"t": "li", "mk": "a", "lv": 3, "text": "the officer’s national flag;"}, {"t": "li", "mk": "b", "lv": 3, "text": "identity badge number;"}, {"t": "li", "mk": "c", "lv": 3, "text": "photograph;"}, {"t": "li", "mk": "d", "lv": 3, "text": "officer’s full names;"}, {"t": "li", "mk": "e", "lv": 3, "text": "name of the agency for which the officer works;"}, {"t": "li", "mk": "f", "lv": 3, "text": "electronically readable access code; and"}, {"t": "li", "mk": "g", "lv": 3, "text": "security features for badge verification purposes."}, {"t": "li", "mk": "iii", "lv": 2, "text": "In the absence of an identity badge, an officer may be given access to the control zone for official purposes by being positively identified by the officer in charge of the agency to which such officer belongs and shall be issued with a temporary identity badge."}, {"t": "li", "mk": "iv", "lv": 2, "text": "In exceptional cases requiring undercover border control operations, the officers are exempt from visibly displaying their identity badges but carry at all times their badges with them for purposes of being able to appropriately identify themselves to appropriate authorities and the users of the control zones who may require such identification."}, {"t": "li", "mk": "v", "lv": 2, "text": "The loss, theft, or destruction of an identity badge is as soon as practicable reported to the issuing authorities of both Partner States who take measures to disable and block the badge from further use on any electronic access systems in place in the control zone."}, {"t": "li", "mk": "3", "lv": 1, "text": "Wearing of Uniforms"}, {"t": "li", "mk": "i", "lv": 2, "text": "All agencies of the two Partner States operating in the control zone of the OSBP wear at all times during the conduct of their official border control functions their agency uniforms."}, {"t": "li", "mk": "ii", "lv": 2, "text": "Officers on duty whose agencies do not wear uniforms or in special circumstances where the wearing of uniforms is waived, the officers are at all times smartly dressed in their civilian clothes."}, {"t": "li", "mk": "iii", "lv": 2, "text": "Each Partner State prescribes an appropriate dress code for its officers in the border control zones."}, {"t": "h", "id": "8.2.2", "text": "Movement of Equipment"}, {"t": "li", "mk": "1", "lv": 1, "text": "The movement of equipment required for the discharge of duties to and from the control zone in the host Partner State is subject to proper inventory with the lead agencies."}, {"t": "li", "mk": "2", "lv": 1, "text": "The following procedure applies when an adjoining Partner State brings any equipment for official use into the control zone:"}, {"t": "li", "mk": "i", "lv": 2, "text": "Drafting of a schedule of the equipment showing quantities, description, serial numbers or identity marks and any additional remarks that help identify the equipment in question and lodge the schedule with the OSBP facilities manager;"}, {"t": "li", "mk": "ii", "lv": 2, "text": "When bringing the equipment into the control zone, present the equipment to the facilities manager for verification against the schedule as submitted;"}, {"t": "li", "mk": "iii", "lv": 2, "text": "Ensuring acknowledgement by the facilities manager of the accuracy of the schedule by signing and dating the schedule and stamping it for entry into the control zone as may be appropriate; and"}, {"t": "li", "mk": "iv", "lv": 2, "text": "Ensuring that the concerned State deploys the equipment into the control zone as it considers necessary."}, {"t": "li", "mk": "3", "lv": 1, "text": "The procedure for exit from the control zone for any equipment previously brought into the control zone for official use is as follows-"}, {"t": "li", "mk": "i", "lv": 2, "text": "drafting of a schedule of the equipment showing quantities, description, serial numbers or identity marks and remarks indicating details of the schedule under which the equipment was initially brought into the control zone;"}, {"t": "li", "mk": "ii", "lv": 2, "text": "presenting the equipment to be exited to the facilities manager of the OSBP for verification against the schedule as submitted;"}, {"t": "li", "mk": "iii", "lv": 2, "text": "ensuring acknowledgement by the facilities manager of the accuracy of the schedule by signing and dating the schedule and stamping it for exit from the control zone as may be appropriate; and"}, {"t": "li", "mk": "iv", "lv": 2, "text": "ensuring that the concerned State removes the equipment from the control zone back into its territory as it considers necessary."}, {"t": "li", "mk": "4", "lv": 1, "text": "The adjoining Partner State may at any time subject to proper entry and exit formalities install in or remove from the offices and facilities allocated by the host State for its use any office fittings of a temporary nature."}, {"t": "h", "id": "8.2.3", "text": "Carrying of Arms in the Control Zone"}, {"t": "li", "mk": "1", "lv": 1, "text": "The law enforcement agencies of the host State charged with responsibilities for maintenance of peace, security and law and order in the control zone of the OSBP may carry arms as are mandated in their national laws for purposes of discharging their obligations under the Act."}, {"t": "li", "mk": "2", "lv": 1, "text": "The officers of the adjoining Partner State are not allowed to carry any arms in the control zone in the host Partner State except by special arrangements with the host Partner State."}, {"t": "li", "mk": "3", "lv": 1, "text": "The special arrangements may include the carriage of arms by the officers through the common control zone to the adjoining Partner State’s exclusive use areas where it has full control and security responsibilities."}, {"t": "li", "mk": "4", "lv": 1, "text": "The use of arms within the control zone be restricted to self-defensive action and action in defense of other persons and any other lawful purpose which the adjoining Partner States agree upon."}, {"t": "li", "mk": "5", "lv": 1, "text": "Each adjoining Partner State issues clear standing orders to be observed by its officers on the use of arms in border control zones."}, {"t": "li", "mk": "6", "lv": 1, "text": "The officers who are authorized to bring arms into the control zone are personally responsible and must take all measures to ensure the safety of the arms and prevent access to such arms by unauthorized persons."}, {"t": "li", "mk": "7", "lv": 1, "text": "Where the arms are not in use, the arms are safely and securely locked away in an appropriate armory provided by each adjoining Partner State."}, {"t": "h", "id": "8.2.4", "text": "Repatriation"}, {"t": "li", "mk": "1", "lv": 1, "text": "Denied Exit"}, {"t": "p", "text": "Prior to completion of exit procedures, suspects or offenders may be detained or arrested, and vehicles, goods, animals, and monies may be seized, impounded, or confiscated, in the host Partner State control zone by the officers from the adjoining Partner State, and shall be returned to the Partner State of departure or exit."}, {"t": "li", "mk": "2", "lv": 1, "text": "Denied Entry"}, {"t": "p", "text": "Notwithstanding having obtained exit clearance from the adjoining state, the Partner State of entry may decline to grant entry to persons, goods, vehicles, and animals. Such persons, goods, vehicles, and animals may be returned to the Partner State of exit, or in the case of goods, vehicles, and animals, they may be disposed of appropriately."}, {"t": "h", "id": "8.2.5", "text": "Requests for Assistance"}, {"t": "li", "mk": "1", "lv": 1, "text": "Requests for General Assistance"}, {"t": "p", "text": "Requests for general assistance by officers of the adjoining state of the host Partner State may be made on an agency-to-agency basis. Such requests shall not be unreasonably denied."}, {"t": "li", "mk": "2", "lv": 1, "text": "Requests for Assistance Involving Arms"}, {"t": "p", "text": "Requests for protection and assistance involving the show and use of arms by the law enforcement officers of the host Partner State by officers of the adjoining Partner State shall be channelled via the lead agency or directly in case of emergency."}, {"t": "h", "id": "8.2.6", "text": "Communication of Records of Host State Official Investigation Reports"}, {"t": "p", "text": "Upon the request of the adjoining Partner State, the host Partner State law enforcement agents may communicate their records of witness statements collected and investigation reports in the control zone. Upon request, the host Partner State authorities may provide certified copies of those documents. Such requests shall not be unreasonably denied."}, {"t": "h", "id": "8.2.7", "text": "Notification of Enforcement Measures against Officers from the Adjoining Partner State"}, {"t": "p", "text": "The host Partner State shall immediately inform the adjoining Partner State through the lead agencies about enforcement measures taken against officers of the adjoining Partner State for offences committed in the control zone outside the scope of their function(s)."}]}]}, {"n": 9, "title": "OSBP Management", "sections": [{"id": "9.1", "title": "Component Parts of OSBP Management", "blocks": [{"t": "p", "text": "OSBP management comprises three component parts:"}, {"t": "li", "mk": "i", "lv": 2, "text": "the technical operational management (the border clearance and control activity);"}, {"t": "li", "mk": "ii", "lv": 2, "text": "facility management (maintenance, repair, and provision of utilities for the OSBP facility); and"}, {"t": "li", "mk": "iii", "lv": 2, "text": "safety and security, and traffic management, in the OSBP facility."}]}, {"id": "9.2", "title": "Management Modes", "blocks": [{"t": "li", "mk": "1", "lv": 1, "text": "The component part of border clearance and control activity relates to the core activity of the border agencies."}, {"t": "li", "mk": "2", "lv": 1, "text": "Both the component part of border clearance and control activity and the safety and security, and the component part of traffic management, require the exercise of sovereign powers that may affect the fundamental rights of citizens; therefore, these component parts of OSBP management are not suitable for privatization or outsourcing. Exceptions may relate to private security and traffic management services."}, {"t": "li", "mk": "3", "lv": 1, "text": "The component part of OSBP facility management offers several possibilities: it may be entrusted to either a public body (the lead agency at the border, the Ministry responsible for border facilities, or to a parastatal). It may also be outsourced to the private sector, or it may be undertaken by a public-private special purpose vehicle."}]}, {"id": "9.3", "title": "OSBP Facility Management", "blocks": [{"t": "h", "id": "9.3.1", "text": "Components of Facility Management"}, {"t": "p", "text": "OSBP facility management includes:"}, {"t": "li", "mk": "i", "lv": 2, "text": "maintenance, repair, rehabilitation, and replacement of the infrastructure and facilities;"}, {"t": "li", "mk": "ii", "lv": 2, "text": "sanitation, waste management, and garden maintenance;"}, {"t": "li", "mk": "iii", "lv": 2, "text": "the provision of utilities (e.g., safe water, electric power); and"}, {"t": "li", "mk": "iv", "lv": 2, "text": "specialized border control devices or services for shared use, such as:"}, {"t": "li", "mk": "a", "lv": 3, "text": "closed circuit television (CCTV) or charged couple device (CCD) cameras;"}, {"t": "li", "mk": "a", "lv": 3, "text": "thermographic (i.e., infrared or thermal imaging) cameras;"}, {"t": "li", "mk": "b", "lv": 3, "text": "motor vehicle automatic identification (license plate readers);"}, {"t": "li", "mk": "c", "lv": 3, "text": "x-ray scanners;"}, {"t": "li", "mk": "d", "lv": 3, "text": "high tech surveillance devices;"}, {"t": "li", "mk": "e", "lv": 3, "text": "non-intrusive human security screening devices;"}, {"t": "li", "mk": "f", "lv": 3, "text": "incinerators;"}, {"t": "li", "mk": "g", "lv": 3, "text": "provision of ICT broadband;"}, {"t": "li", "mk": "h", "lv": 3, "text": "provision of emergency health services (e.g., a sick bay); and"}, {"t": "li", "mk": "i", "lv": 3, "text": "provision of a staff canteen."}, {"t": "h", "id": "9.3.2", "text": "Distribution of Responsibilities"}, {"t": "p", "text": "In the case of a juxtaposed or straddled OSBP, the host Partner State is responsible for the management of the OSBP facility. In the case of a wholly located OSBP, the responsibility for management of the OSBP may be shared by the adjoining Partner States."}, {"t": "h", "id": "9.3.3", "text": "Allocation of Utility, Maintenance, and Related Costs"}, {"t": "li", "mk": "1", "lv": 1, "text": "Exclusive Use Equipment"}, {"t": "li", "mk": "i", "lv": 2, "text": "The cost of exclusive use equipment and related utilities such as telecommunication bills and any other direct usage bills, is borne by the respective agencies using the equipment exclusively. Whether an item of equipment is exclusive use may depend on the case."}, {"t": "li", "mk": "ii", "lv": 2, "text": "Each Partner State is responsible for the routine or ad hoc maintenance of its own equipment brought into the control zone for official use."}, {"t": "li", "mk": "iii", "lv": 2, "text": "Any assistance that may be sought from the other Partner State in this regard is on a cost recovery basis using prevailing market rates as applicable from time to time."}, {"t": "li", "mk": "iv", "lv": 2, "text": "Where equipment brought into the control zone for the official use of one Partner State is availed for use by the other Partner State, the use shall be on the terms and conditions agreed between the two concerned Partner States."}, {"t": "li", "mk": "v", "lv": 2, "text": "The adjoining Partner State bears the cost of the permanent office fittings, which once installed shall be ceded to the structure and become the responsibility of the host State to maintain."}, {"t": "li", "mk": "2", "lv": 1, "text": "Jointly Used Facilities"}, {"t": "li", "mk": "i", "lv": 2, "text": "Juxtaposed Facilities: Each host Partner State will bear the cost related to the control zone located in its territory."}, {"t": "li", "mk": "ii", "lv": 2, "text": "Wholly Located and Straddled Facilities: The cost of wholly located and straddled facilities may be shared between the adjoining Partner States."}, {"t": "li", "mk": "iii", "lv": 2, "text": "Emergency repairs may be undertaken by the concerned party, up to an amount to be specified in a bilateral agreement and subject to cost recovery according to the preceding rules."}, {"t": "li", "mk": "3", "lv": 1, "text": "The cost of alteration of or damage to the host Partner State facilities by the adjoining Partner State is borne by the latter."}, {"t": "h", "id": "9.3.4", "text": "Due Diligence in the Use of Assets"}, {"t": "li", "mk": "1", "lv": 1, "text": "An adjoining Partner State may install any office fittings in the offices and facilities allocated by the host State for its use. If such fittings are of a permanent nature, they can only be installed with the approval of the host State."}, {"t": "li", "mk": "2", "lv": 1, "text": "Once the permanent office fittings are installed by the adjoining Partner State in the offices and facilities allocated by the host State for its use, they are ceded to the structure."}, {"t": "li", "mk": "3", "lv": 1, "text": "Alterations to the infrastructure in the control zone of the host State, required to achieve optimal positioning of equipment and use of space, may be undertaken by the adjoining Partner State with the approval of the host State."}, {"t": "li", "mk": "4", "lv": 1, "text": "The Partner State effecting any alterations may be required, depending on the nature of the alterations required and at its cost, to restore the infrastructure back to its original condition when the alterations are no longer needed."}, {"t": "li", "mk": "5", "lv": 1, "text": "The responsibility for ensuring proper handling and usage of the equipment shall lie equally with the adjoining Partner States. Any damage caused to the facilities and to any joint usage equipment shall immediately be reported to the appropriate authorities, through the lead agencies, for requisite attention. The cost of accidental damage to infrastructure and equipment is borne by the host Partner State and recovered from insurance if applicable."}, {"t": "li", "mk": "6", "lv": 1, "text": "The cost of repair or replacement in case of damage caused willfully or due to gross negligence by an officer of a Partner State, is borne by the Partner State. In this case, the adjoining Partner State may recover the cost from its officer."}]}, {"id": "9.4", "title": "Maintenance of Peace, Law and Order, Health, Safety, and Security Management in the Control Zone", "blocks": [{"t": "li", "mk": "1", "lv": 1, "text": "The host Partner State authorities are responsible for maintaining peace, law and order, and for ensuring the health, safety, and the security of persons (travellers, vehicle crew, staff members of authorities including officers of the adjoining Partner State, authorized facilitation agents, and authorized service providers), vehicles and goods, infrastructure, facilities, and equipment in the control zone."}, {"t": "li", "mk": "2", "lv": 1, "text": "Certain specific parts of this function may be outsourced to the private sector."}, {"t": "li", "mk": "3", "lv": 1, "text": "For this purpose, in case of compelling need and national laws permitting, the host Partner State may request the assistance of the law enforcement agencies of the adjoining Partner State, including armed assistance if required by the circumstances."}, {"t": "li", "mk": "4", "lv": 1, "text": "The officer in charge of the host Partner State lead agency has responsibility for overall coordination of peace, law and order, safety, security, and traffic management for the OSBP. However, in the case of a wholly located OSBP, this responsibility may be determined in a bilateral agreement."}, {"t": "li", "mk": "5", "lv": 1, "text": "For the purpose of preparing for emergency situations, the adjoining Partner States should put in place an emergency preparedness plan that includes a public health contingency plan, a safety and security plan, a disaster preparedness plan, and a business continuity management plan. The following criteria may be considered in the preparation of the plans:"}, {"t": "li", "mk": "i", "lv": 2, "text": "risk assessment of the perceived nature of the threat (e.g., security, safety, health);"}, {"t": "li", "mk": "ii", "lv": 2, "text": "roles and responsibilities of different border agencies during emergencies; and"}, {"t": "li", "mk": "iii", "lv": 2, "text": "coordination and information sharing mechanism(s)."}, {"t": "li", "mk": "6", "lv": 1, "text": "The emergency preparedness plan provides for regular simulations drills. Simulation exercises may be:"}, {"t": "li", "mk": "i", "lv": 2, "text": "tabletop (i.e., theoretical, involving simulated scenarios in an informal setting);"}, {"t": "li", "mk": "ii", "lv": 2, "text": "partial (i.e., involving selected response organizations and interfaces, with the rest simulated); or"}, {"t": "li", "mk": "iii", "lv": 2, "text": "full (i.e., involving full participation by all on-site and off-site response organizations)."}, {"t": "li", "mk": "7", "lv": 1, "text": "The adjoining Partner States may provide for joint security operations and joint border patrols through bilateral agreements. Hot pursuit may be agreed upon in such bilateral agreements."}]}, {"id": "9.5", "title": "Traffic Management", "blocks": [{"t": "li", "mk": "1", "lv": 1, "text": "The host Partner State is responsible for traffic management and it pursues:"}, {"t": "li", "mk": "i", "lv": 2, "text": "optimal, orderly, and safe use of the roads and parking spaces;"}, {"t": "li", "mk": "ii", "lv": 2, "text": "smooth traffic flow; and"}, {"t": "li", "mk": "iii", "lv": 2, "text": "swift departure from the control zone after completion of border crossing controls."}, {"t": "li", "mk": "2", "lv": 1, "text": "The authority in charge of traffic management divides the traffic into the respective categories and channel them to the correct track/lane, the correct area of the control zone, or the correct control counter according to their nature and status."}, {"t": "li", "mk": "3", "lv": 1, "text": "Users are guided by signage (also indicating speed limits and weight or dimension prohibitions for all sections of the control zone) and by the traffic management authority to proceed to the appropriate traffic lane/track or the designated area, as the case may be."}, {"t": "li", "mk": "4", "lv": 1, "text": "When a user follows an incorrect traffic lane/track, he or she is redirected by the officers in charge of traffic control."}, {"t": "li", "mk": "5", "lv": 1, "text": "At the entry gate (of the secured access route) of the control zone, the authority in charge of traffic management:"}, {"t": "li", "mk": "i", "lv": 2, "text": "performs an access selection by allowing only authorized users; and"}, {"t": "li", "mk": "ii", "lv": 2, "text": "carries out a summary security/safety check as necessary."}, {"t": "li", "mk": "6", "lv": 1, "text": "Upon completion of the border control formalities, the users shall exit the control zone into the territory of the Partner State of entry, following appropriate signage."}, {"t": "li", "mk": "7", "lv": 1, "text": "At the exit gate (of the secured exit corridor) of the control zone, the authority in charge of safety, security, and traffic management shall on the basis of the gate pass or exit note, verify the completion of the control formalities before releasing the user into the Partner State of immediate destination."}]}]}, {"n": 10, "title": "Cooperation between Adjoining Partner States and among Agencies", "sections": [{"id": "10", "title": "Cooperation between Adjoining Partner States and among Agencies", "blocks": [{"t": "p", "text": "The cooperation between the adjoining partner states of an OSBP and among agencies is realized in the following fields and manner."}]}, {"id": "10.1", "title": "Harmonization of Operations", "blocks": [{"t": "h", "id": "10.1.1", "text": "Operational Hours"}, {"t": "p", "text": "Under ideal circumstances, an OSBP will be operated 24 hours a day, seven days a week. Where 24-hour operation is not possible, the operating hours of OSBPs (including work shifts) should be synchronized mutually by the adjoining Partner States’ border clearance agencies in line with the Act and Regulations taking into consideration prevailing circumstances at each border crossing. Where necessary, the countries should harmonize opening and closing hours, taking into consideration different time zones."}, {"t": "h", "id": "10.1.2", "text": "Documents and Procedures"}, {"t": "p", "text": "For the purpose of joint border controls, harmonization of procedures, documents, and officer codes of conduct of the adjoining Partner States will be pursued through OSBP management and electronic single window systems."}]}, {"id": "10.2", "title": "Sharing and Exchange of Information", "blocks": [{"t": "h", "id": "10.2.1", "text": "Mandate"}, {"t": "p", "text": "The authorities of the adjoining Partner States reciprocally share and exchange intelligence and other information on persons, goods, and vehicles before or on arrival at the border."}, {"t": "h", "id": "10.2.2", "text": "Subjects of Information Sharing"}, {"t": "li", "mk": "1", "lv": 1, "text": "Persons: For the purpose of immigration clearance, the information exchanged relates to criminal records and intelligence on subversive elements."}, {"t": "li", "mk": "2", "lv": 1, "text": "Goods: For the purpose of pre-clearance and simplified clearance procedures, the information exchanged relates to the nature and origin of the goods, as well as criminal and intelligence information on stolen goods, undeclared goods, cultural heritage, protected animal or plant species, and counterfeited goods."}, {"t": "li", "mk": "3", "lv": 1, "text": "Vehicles: The information to be exchanged relates to the characteristics of the vehicle (log book details, chassis, size, weight, axle load) to check conformity with technical standards, for temporary admission, for checking insurance cover, and for checking criminal information with respect to stolen vehicles."}, {"t": "h", "id": "10.2.3", "text": "Limits on Information Exchange"}, {"t": "p", "text": "Exchange of information may be subject to confidentiality restrictions in accordance with national, regional, and international laws and regulations."}, {"t": "h", "id": "10.2.4", "text": "Channel of Information Exchange"}, {"t": "p", "text": "The information exchange is realized through secure shared platforms or as agreed."}]}]}, {"n": 11, "title": "Communication", "sections": [{"id": "11", "title": "Communication", "blocks": [{"t": "p", "text": "This chapter provides details on communication procedures between the border control agencies and their counterparts in the adjoining Partner States and with their headquarters and with international authorities."}]}, {"id": "11.1", "title": "Communication between the Adjoining Partner States", "blocks": [{"t": "p", "text": "All formal communication between the adjoining Partner States’ border agencies takes place via their respective national lead agencies, which shall be responsible for further dissemination. Notwithstanding the above, agency- to-agency communication should take place for the purpose of executing their day-to-day controls."}]}, {"id": "11.2", "title": "Communication with Border Control Agencies", "blocks": [{"t": "li", "mk": "1", "lv": 1, "text": "The facilitation agents at an OSBP have in the provision of their facilitation services in the control zone, individually or collectively, free and direct access to all the border control agencies of the two States, individually or collectively, at all times."}, {"t": "li", "mk": "2", "lv": 1, "text": "In cases where the communication is intended for the collective attention of the national border control agencies or of the two adjoining Partner States or any collective part thereof, such communication is directed to the lead agencies of the two States who shall coordinate the intended recipients of the communication at national or bilateral levels or both."}, {"t": "li", "mk": "3", "lv": 1, "text": "Similarly, this provision applies, mutatis mutandis, in reverse to communication from the border control agencies to the facilitation agents operating at the OSBP."}]}, {"id": "11.3", "title": "Communication with Users and the General Public", "blocks": [{"t": "li", "mk": "1", "lv": 1, "text": "Two kinds of information may be circulated to users and the general public. One is information applicable over a longer term (e.g., border operating hours, fee schedules, this Manual itself, applicable bilateral agreements). Another is information applicable only for a short period of time (e.g., information on emergencies and temporary measures)."}, {"t": "li", "mk": "2", "lv": 1, "text": "A strategy may be developed to improve the traffic flow for the users and general public by providing information desks, information on the internet, signage, billboards, videos, media advertising, road banners, brochures, and leaflets."}, {"t": "li", "mk": "3", "lv": 1, "text": "The information disseminated is to be approved at the appropriate level depending on the type of information."}]}, {"id": "11.4", "title": "Notifications to National and International Authorities", "blocks": [{"t": "h", "id": "11.4.1", "text": "Communication with the National Authorities"}, {"t": "p", "text": "The respective agencies are to communicate with their respective ministry/department through the appropriate administrative channels, which in turn communicate with other Partner State authorities."}, {"t": "h", "id": "11.4.2", "text": "Communication with International Organizations"}, {"t": "p", "text": "When issues of concern have been identified at the border (e.g., disease alerts, terrorism incidents), the competent authorities at the border inform their respective national/government authorities, which in turn communicate with the relevant international organization(s). Also, communications from international organizations regarding issues of concern are communicated by the respective national/government authorities to the competent authorities at the border."}]}]}]}</script>
<script>
const D=JSON.parse(document.getElementById("data").textContent);
/* Who each section is for. Audiences are the ones named in the manual's foreword. */
const A={OF:"Border officers",MG:"Managers & committees",FA:"Facilitation agents",TR:"Transporters & travellers",BR:"Border residents"};
const AUD={"1.1":"OF MG","1.2":"OF MG FA TR BR","1.3":"OF MG","1.4":"OF MG","2.1":"MG","2.2":"MG","2.3":"MG","2.4":"MG","2.5":"MG","2.6":"MG","2.7":"MG OF",
 "3":"OF MG FA TR","4.1":"MG OF","4.2":"OF FA TR","5.1":"OF TR BR","5.2":"OF TR","5.3":"OF FA TR","5.4":"OF MG","5.5":"OF MG",
 "6.1":"OF","6.2":"OF MG","6.3":"OF MG","7.1":"FA OF","7.2":"FA OF","8.1":"OF MG","8.2":"OF MG","9.1":"MG","9.2":"MG","9.3":"MG","9.4":"OF MG","9.5":"OF TR MG",
 "10.1":"MG OF","10.2":"OF MG","11.1":"MG","11.2":"MG OF","11.3":"MG TR BR","11.4":"MG OF"};
/* Editorial cross-references added for the prototype (the printed manual has very few). */
const REL={"1.4":["8.2","2.4"],"2.4":["2.5","2.7"],"2.5":["2.4","2.6"],"2.7":["10.1","9.2"],"3":["4.2","5.1","8.2"],"4.1":["4.2","9.3"],"4.2":["8.1","7.1","9.5"],
 "5.1":["5.5","4.2","9.4"],"5.2":["5.1","9.5"],"5.3":["5.4","5.5","7.1"],"5.4":["10.2","5.3"],"5.5":["9.4","11.4"],"6.1":["6.2","8.2"],"6.2":["8.2","6.3"],"6.3":["6.2","9.3"],
 "7.1":["7.2","4.2"],"7.2":["7.1","9.3"],"8.1":["8.2","4.2"],"8.2":["6.2","8.1","9.4"],"9.1":["9.2","9.3"],"9.2":["2.7","9.1"],"9.3":["4.1","6.3"],"9.4":["5.5","8.2"],"9.5":["5.2","4.2"],
 "10.1":["10.2","2.4"],"10.2":["5.4","11.1"],"11.1":["10.2","11.4"],"11.2":["11.1","10.1"],"11.3":["9.5","5.1"],"11.4":["5.5","11.1"],"1.1":["1.2","3"],"1.2":["1.3","1.4"],"1.3":["1.2","3"],
 "2.1":["2.2","2.4"],"2.2":["2.3","2.4"],"2.3":["2.4","2.5"],"2.6":["2.5","9.3"]};
const QUICK=["5.1","5.5","8.2","6.1","4.2","3"];
const FLOWS={
 "5.1":[["Pedestrians",["Exit State","Security screening","Health screening","Immigration counter","Customs counter*","Other controls*","Completion / exit","Entry State"]],
        ["Public service vehicles",["Exit State","Parking, health screening, offload","Proceed to the counter","Security screening","Immigration counter","Customs / other controls*","Payment*","Completion / exit","Entry State"]],
        ["Private vehicles",["Exit State","Parking, disembarkation, offload","Security screening","Health screening","Immigration counter","Customs / other controls*","Payment*","Completion / exit","Entry State"]]],
 "5.2":[["Means of transport",["Exit State","Security screening","Health screening","Immigration counter","Controls on motor vehicle","Provision of certificate","Payment","Completion / exit","Entry State"]]],
 "5.3":[["Clearance of goods",["Exit State","Parking","Exit and entry border controls","Documents for clearance process","Physical inspection*","Completion / exit","Entry State"]]]};
/* Glossary terms linked inline (generic words like "officer" are left out to keep the text readable). */
const LINK=["adjoining Partner State","host Partner State","home Partner State","control zone","exclusive use area","facilitation agents","free pratique","extraterritoriality","single window system","transshipment","hot pursuit","lead agency","gate pass","authorized economic operator","risk management","perishable goods","hazardous goods","quarantine","competent authorities","JBOC","BMC","BOSC","NOSC","ROSC"];

/* ---------- Index ---------- */
const CH=D.chapters, SEC=[], byId={}, intro={};
CH.forEach(c=>{
  c.sections.forEach(s=>{
    if(s.id===String(c.n)&&c.sections.length>1){intro[c.n]=s.blocks.map(b=>b.text).join(" ");return}
    s.ch=c.n;SEC.push(s);byId[s.id]=s;
    s.aud=(AUD[s.id]||"OF").split(" ");s.rel=(REL[s.id]||[]).filter(r=>r!==s.id);
    let cur=s.id;s.blocks.forEach(b=>{if(b.t==="h")cur=b.id;b.anchor=cur});
    s.plain=s.blocks.filter(b=>b.text).map(b=>b.text).join(" ");
    s.sum=(s.blocks.find(b=>b.t==="p"||b.t==="li")||{text:""}).text;
  });
  c.list=SEC.filter(s=>s.ch===c.n);
});
SEC.forEach(s=>s.backs=SEC.filter(o=>o.rel.includes(s.id)).map(o=>o.id));
const G=D.glossary, gByLower=Object.fromEntries(G.map(g=>[g.term.toLowerCase(),g]));
const linkTerms=LINK.filter(t=>gByLower[t.toLowerCase()]).sort((a,b)=>b.length-a.length);
const termRe=new RegExp("\\b("+linkTerms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\b","g");

/* ---------- Helpers ---------- */
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let saved=new Set(store.get("osbp-saved",[])), aud=store.get("osbp-aud",null);
const $=s=>document.querySelector(s), view=$("#view");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shorten=(t,n=150)=>t.length>n?t.slice(0,t.lastIndexOf(" ",n))+"…":t;
const chOf=s=>CH[s.ch-1];
const label=s=>s.id.includes(".")?s.id:"Ch "+s.id;

function rich(text,seen){
  let h=esc(text);
  h=h.replace(termRe,(m)=>{const k=m.toLowerCase();if(seen.has(k))return m;seen.add(k);return `<button class="term" data-term="${esc(gByLower[k].term)}">${m}</button>`});
  h=h.replace(/\b[Ss]ection (\d+\.\d+)(\.\d+)?/g,(m,a,b)=>byId[a]?`<button class="xref" data-go="s${a}" data-anchor="${a}${b||""}">${m}</button>`:m);
  return h;
}

/* ---------- Views ---------- */
function toc(){
  $("#toc").innerHTML=CH.map(c=>`<div class="toc-topic"><button data-go="c${c.n}"><span class="n">${c.n}</span>${esc(c.title)}</button>
   ${c.list.length>1||c.list[0].id!==String(c.n)?`<ul class="toc-sub">${c.list.map(s=>`<li><button data-go="s${s.id}" data-sid="${s.id}"><span class="n">${s.id}</span>${esc(s.title)}</button></li>`).join("")}</ul>`:""}</div>`).join("");
}
const rowHtml=s=>`<li><button data-go="s${s.id}"><span class="n">${label(s)}</span><span class="t">${esc(s.title)}<small>${esc(shorten(s.sum,140))}</small></span><span class="tags">${s.aud.slice(0,1).map(a=>`<span class="tag">${A[a]}</span>`).join("")}</span></button></li>`;
const refBtn=id=>`<button data-go="s${id}"><span class="n">${label(byId[id])}</span>${esc(byId[id].title)}</button>`;
const foot=`<p class="foot">Content: EAC One-Stop Border Posts Procedures Manual, 2nd edition (September 2023), © 2024 East African Community. Used as sample content in an independent concept prototype; not an official EAC or IOM product.</p>`;

function home(){
  const list=aud?SEC.filter(s=>s.aud.includes(aud)):[];
  view.innerHTML=`<div class="stack">
   <div><div class="eyebrow">Digital edition · working prototype</div>
    <h1>One-Stop Border Posts Procedures Manual</h1>
    <p class="lede">The EAC manual as a searchable field reference. Browse by chapter, search any procedure, tap a defined term for its meaning, and follow links to related sections.</p></div>
   <div class="stats"><div><b>${CH.length}</b>chapters</div><div><b>${SEC.length}</b>sections</div><div><b>${G.length}</b>defined terms</div><div><b>3</b>clearance flows</div></div>
   <section class="stack" style="gap:12px"><h2>Show sections for</h2>
    <div class="roles">${Object.entries(A).map(([k,v])=>`<button class="chip" data-aud="${k}" aria-pressed="${aud===k}">${v}</button>`).join("")}</div>
    ${aud?`<ul class="sublist">${list.map(rowHtml).join("")}</ul>`:""}</section>
   <section class="stack" style="gap:12px"><h2>Most used at the counter</h2>
    <div class="quick">${QUICK.map(id=>`<button data-go="s${id}"><span class="n">${label(byId[id])}</span>${esc(byId[id].title)}</button>`).join("")}</div></section>
   <section class="stack" style="gap:12px"><h2>Chapters</h2>
    <div class="topics">${CH.map(c=>`<button class="topic-card" data-go="c${c.n}"><span class="n">Chapter ${c.n}</span><h3>${esc(c.title)}</h3><p>${esc(shorten(intro[c.n]||c.list[0].sum,120))}</p><span class="count">${c.list.length>1?c.list.length+" sections":"1 section"}</span></button>`).join("")}</div></section>
   <section class="stack" style="gap:12px"><h2>About this prototype</h2>
    <div class="notes">
     <div class="note"><h3>Works offline at the post</h3><p>Built as a progressive web app. After the first visit the whole manual is cached on the device, so reading and search keep working when the network drops.</p></div>
     <div class="note"><h3>One build for every screen</h3><p>The same responsive app runs on counter desktops, tablets and officers' phones, and can be installed to the home screen.</p></div>
     <div class="note"><h3>Content as structured data</h3><p>The manual is converted into chapters, clauses and defined terms, so translations and country notes can be added without rebuilding the app.</p></div>
     <div class="note"><h3>Built for the pilot</h3><p>The pilot version adds a feedback control on each section so comments from the test Partner State feed the final revision.</p></div>
    </div></section>
   ${foot}
  </div>`;
}

function chapter(n){
  const c=CH[n-1];
  if(c.list.length===1&&c.list[0].id===String(n))return section(String(n));
  view.innerHTML=`<div class="crumbs"><button data-go="home">Manual</button><span>›</span><span>Chapter ${n}</span></div>
   <div class="eyebrow">Chapter ${n} of ${CH.length}</div><h1>${esc(c.title)}</h1>
   ${intro[n]?`<p class="lede">${esc(intro[n])}</p>`:""}
   <ul class="sublist" style="margin-top:24px">${c.list.map(rowHtml).join("")}</ul>`;
}

function flowHtml(id){
  const f=FLOWS[id];if(!f)return "";
  const strip=steps=>`<ol class="flow">${steps.map((t,i)=>`<li class="${i===0||i===steps.length-1?"end":t.endsWith("*")?"opt":""}"><span>${esc(t.replace("*",""))}</span></li>`).join("")}</ol>`;
  return `<div class="flowwrap" data-flow="${id}">
   ${f.length>1?`<div class="flowtabs">${f.map((x,i)=>`<button class="chip" data-flowtab="${i}" aria-pressed="${i===0}">${esc(x[0])}</button>`).join("")}</div>`:`<div class="eyebrow" style="margin-bottom:10px">${esc(f[0][0])}</div>`}
   <div class="flowbody">${strip(f[0][1])}</div>
   <div class="flowkey"><span>Dashed: performed as the case may be</span><span class="deny">Entry may be denied at any stage under applicable law</span></div></div>`;
}

function section(id,anchor){
  const s=byId[id], c=chOf(s), i=SEC.indexOf(s), prev=SEC[i-1], next=SEC[i+1], seen=new Set();
  const min=Math.min(...s.blocks.filter(b=>b.t==="li").map(b=>b.lv),9);
  const body=s.blocks.map(b=>{
    if(b.t==="h")return `<h2 class="sub" id="a${b.id.replace(/\./g,"-")}"><span class="n">${b.id}</span>${esc(b.text)}</h2>`;
    if(b.t==="flow")return flowHtml(id);
    if(b.t==="note")return `<div class="notehead">Notes to the flow chart</div>`;
    const fig=/chart below|Note: The figure/.test(b.text)?`<div class="figure">▣ Diagram in the printed manual. The production build redraws it as an interactive figure.</div>`:"";
    if(b.t==="li")return `<div class="li lv${b.lv} d${Math.min(b.lv-min,2)}"><span class="mk">(${esc(b.mk)})</span><div>${rich(b.text,seen)}</div></div>`+fig;
    return `<p>${rich(b.text,seen)}</p>`+fig;
  }).join("");
  view.innerHTML=`<div class="crumbs"><button data-go="home">Manual</button><span>›</span><button data-go="c${c.n}">Chapter ${c.n}. ${esc(c.title)}</button></div>
   <div class="sec-head"><div><span class="num">§ ${s.id}</span><h1>${esc(s.title)}</h1></div>
    <button class="save" data-save="${id}" aria-pressed="${saved.has(id)}">${saved.has(id)?"★ Saved":"☆ Save"}</button></div>
   <div class="meta">${s.aud.map(a=>`<span class="tag">${A[a]}</span>`).join("")}</div>
   <div class="prose">${body}</div>
   <div class="related">
    ${s.rel.length?`<div><h3>Related sections</h3><ul>${s.rel.map(r=>`<li>${refBtn(r)}</li>`).join("")}</ul></div>`:""}
    ${s.backs.length?`<div><h3>Linked from</h3><ul>${s.backs.map(r=>`<li>${refBtn(r)}</li>`).join("")}</ul></div>`:""}
   </div>
   <div class="pager">${prev?`<button data-go="s${prev.id}"><small>Previous</small>${label(prev)} ${esc(prev.title)}</button>`:""}${next?`<button data-go="s${next.id}"><small>Next</small>${label(next)} ${esc(next.title)}</button>`:""}</div>
   ${foot}`;
  if(anchor){const el=document.getElementById("a"+anchor.replace(/\./g,"-"));if(el){requestAnimationFrame(()=>{el.scrollIntoView({block:"start"});el.classList.add("flash")});return true}}
}

function hl(text,terms){let h=esc(text);terms.forEach(t=>{if(t.length>1)h=h.replace(new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>")});return h}
function search(q){
  q=(q||"").trim();const terms=q.toLowerCase().split(/\s+/).filter(Boolean);let res=[];
  if(terms.length){
    SEC.forEach(s=>{
      const groups={};s.blocks.forEach(b=>{if(!b.text)return;(groups[b.anchor]=groups[b.anchor]||[]).push(b.text)});
      Object.entries(groups).forEach(([anc,txts])=>{
        const head=anc===s.id?s.title:(s.blocks.find(b=>b.t==="h"&&b.id===anc)||{}).text;
        const all=(head+" "+txts.join(" ")).toLowerCase();
        if(!terms.every(t=>all.includes(t)))return;
        let sc=terms.reduce((a,t)=>a+((head||"").toLowerCase().includes(t)?6:0)+(all.split(t).length-1),0);
        const hit=txts.find(x=>x.toLowerCase().includes(terms[0]))||txts[0];
        const p=Math.max(0,hit.toLowerCase().indexOf(terms[0])-60);
        res.push({s,anc,head,sc,snip:(p?"…":"")+shorten(hit.slice(p),180)});
      });
    });
    G.forEach(g=>{const all=(g.term+" "+g.def).toLowerCase();if(terms.every(t=>all.includes(t)))res.push({g,sc:g.term.toLowerCase().includes(terms[0])?20:2})});
    res.sort((a,b)=>b.sc-a.sc);
  }
  const sugg=["body search","fast track","firearms","perishable","operating hours","free pratique"];
  view.innerHTML=`<div class="eyebrow">Search</div><h1>${terms.length?`${res.length} result${res.length===1?"":"s"} for “${esc(q)}”`:"Search the manual"}</h1>
   <p class="lede">${terms.length?"Matches clause text, headings and defined terms.":"Type in the search bar, or try one of these:"}</p>
   <div class="roles" style="margin:16px 0 24px">${sugg.map(w=>`<button class="chip" data-q="${w}">${w}</button>`).join("")}</div>
   ${terms.length&&!res.length?`<p class="empty">No clause contains all of those words. Try fewer words or a broader term.</p>`:""}
   <ul class="results">${res.slice(0,60).map(r=>r.g?`<li><button data-go="glossary" data-anchor="${esc(r.g.term)}"><div class="where">Defined term</div><div class="t">${hl(r.g.term,terms)}</div><p>${hl(shorten(r.g.def,180),terms)}</p></button></li>`
     :`<li><button data-go="s${r.s.id}" data-anchor="${r.anc!==r.s.id?r.anc:""}"><div class="where"><span class="n">§ ${r.anc}</span> · ${esc(r.s.title)}</div><div class="t">${hl(r.head||r.s.title,terms)}</div><p>${hl(r.snip,terms)}</p></button></li>`).join("")}</ul>`;
}

function glossary(anchor){
  view.innerHTML=`<div class="eyebrow">Definitions of terms</div><h1>Glossary</h1>
   <p class="lede">The ${G.length} terms defined in the manual. Linked terms in the text open these definitions in place.</p>
   <dl class="gloss" style="margin-top:24px">${[...G].sort((a,b)=>a.term.localeCompare(b.term,undefined,{sensitivity:"base"})).map(g=>`<div id="g-${esc(g.term.replace(/\W+/g,"-"))}"><dt>${esc(g.term)}</dt><dd>${esc(g.def)}</dd></div>`).join("")}</dl>${foot}`;
  if(anchor){const el=document.getElementById("g-"+anchor.replace(/\W+/g,"-"));if(el){el.scrollIntoView();el.style.background="var(--stamp-soft)";return true}}
}

function savedView(){
  const list=SEC.filter(s=>saved.has(s.id));
  view.innerHTML=`<div class="eyebrow">On this device</div><h1>Saved sections</h1>
   <p class="lede">${list.length?"Sections you starred for quick access.":"Nothing saved yet. Open any section and tap Save to keep it here."}</p>
   ${list.length?`<ul class="sublist" style="margin-top:24px">${list.map(rowHtml).join("")}</ul>`:`<div class="quick" style="margin-top:20px">${QUICK.slice(0,2).map(id=>`<button data-go="s${id}"><span class="n">${id}</span>${esc(byId[id].title)}</button>`).join("")}</div>`}`;
}

/* ---------- Router ---------- */
let cur="home";
function go(r,anchor){
  closePop();cur=r;let anchored=false;
  if(r==="home")home();
  else if(r==="search")search($("#q").value);
  else if(r==="saved")savedView();
  else if(r==="glossary")anchored=glossary(anchor);
  else if(/^c\d+$/.test(r)&&CH[+r.slice(1)-1])chapter(+r.slice(1));
  else if(/^s[\d.]+$/.test(r)&&byId[r.slice(1)])anchored=section(r.slice(1),anchor);
  else{cur="home";home()}
  document.querySelectorAll("[data-sid]").forEach(b=>b.setAttribute("aria-current",cur==="s"+b.dataset.sid));
  const tab=/^[sc]/.test(cur)?"home":cur;
  document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab));
  $("#rail").classList.remove("open");$("#menuBtn").setAttribute("aria-expanded","false");
  try{history.replaceState(null,"","#"+cur)}catch(e){}
  if(!anchored)window.scrollTo(0,0);
}
let pop=null;
function closePop(){if(pop){pop.remove();pop=null}}
function openPop(btn){
  closePop();const g=gByLower[btn.dataset.term.toLowerCase()];
  pop=document.createElement("div");pop.className="pop";pop.setAttribute("role","dialog");
  pop.innerHTML=`<b>${esc(g.term)}</b>${esc(g.def)}<br><button data-go="glossary" data-anchor="${esc(g.term)}">Open glossary</button>`;
  document.body.appendChild(pop);
  const r=btn.getBoundingClientRect(),w=pop.offsetWidth;
  pop.style.left=Math.max(16,Math.min(window.scrollX+r.left,window.scrollX+document.documentElement.clientWidth-w-16))+"px";
  pop.style.top=(window.scrollY+r.bottom+8)+"px";
}
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go],[data-tab],[data-aud],[data-save],[data-q],[data-term],[data-flowtab]");
  if(!g){closePop();if($("#rail").classList.contains("open")&&!e.target.closest("#rail,#menuBtn"))$("#rail").classList.remove("open");return}
  if(g.dataset.term){openPop(g);return}
  if(g.dataset.go)go(g.dataset.go,g.dataset.anchor);
  else if(g.dataset.tab){if(g.dataset.tab==="search"){go("search");$("#q").focus()}else go(g.dataset.tab)}
  else if(g.dataset.aud){aud=aud===g.dataset.aud?null:g.dataset.aud;store.set("osbp-aud",aud);home()}
  else if(g.dataset.save){const id=g.dataset.save;saved.has(id)?saved.delete(id):saved.add(id);store.set("osbp-saved",[...saved]);g.setAttribute("aria-pressed",saved.has(id));g.textContent=saved.has(id)?"★ Saved":"☆ Save"}
  else if(g.dataset.q){$("#q").value=g.dataset.q;search(g.dataset.q)}
  else if(g.dataset.flowtab){const w=g.closest(".flowwrap"),f=FLOWS[w.dataset.flow][+g.dataset.flowtab];
    w.querySelectorAll("[data-flowtab]").forEach(b=>b.setAttribute("aria-pressed",b===g));
    w.querySelector(".flowbody").innerHTML=`<ol class="flow">${f[1].map((t,i)=>`<li class="${i===0||i===f[1].length-1?"end":t.endsWith("*")?"opt":""}"><span>${esc(t.replace("*",""))}</span></li>`).join("")}</ol>`}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePop();if(e.key==="/"&&document.activeElement!==$("#q")){e.preventDefault();$("#q").focus()}});
$("#q").addEventListener("input",e=>{cur="search";search(e.target.value);document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-current",b.dataset.tab==="search"))});
$("#menuBtn").addEventListener("click",e=>{const o=$("#rail").classList.toggle("open");e.currentTarget.setAttribute("aria-expanded",o)});
toc();
go((location.hash||"#home").slice(1));
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h&&h!==cur)go(h)});
</script>

<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
