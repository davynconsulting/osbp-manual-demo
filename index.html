<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OSBP Procedures Manual</title>
<meta name="description" content="EAC One-Stop Border Posts Procedures Manual as a searchable, offline-ready field reference (concept prototype).">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b5d6b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: field handbook. Fixed index rail on desktop, bottom tab bar on phones; reading column ~65ch. */
:root{
  --bg:#f6f7f5; --surface:#ffffff; --ink:#17201f; --muted:#5b6866; --line:#d9dfdc;
  --accent:#0b5d6b; --accent-soft:#e1eef0; --stamp:#b5551d; --stamp-soft:#f7e9df;
  --ok:#2f7a45;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --rail:300px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111817; --surface:#18211f; --ink:#e4ebe8; --muted:#9aa8a5; --line:#2b3633;
  --accent:#5fb7c4; --accent-soft:#16343a; --stamp:#e08a52; --stamp-soft:#3a2518; --ok:#6cc086; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111817; --surface:#18211f; --ink:#e4ebe8; --muted:#9aa8a5; --line:#2b3633;
  --accent:#5fb7c4; --accent-soft:#16343a; --stamp:#e08a52; --stamp-soft:#3a2518; --ok:#6cc086; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}

/* Shell */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:20px 16px 32px}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 6px 16px;border-bottom:1px solid var(--line);margin-bottom:14px;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.brand b{font-family:var(--f-display);font-size:20px;letter-spacing:.01em;line-height:1.15}
.brand span{font-family:var(--f-display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.toc-topic{margin-bottom:4px}
.toc-topic>button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px 6px;border-radius:6px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.25}
.toc-topic>button:hover{background:var(--accent-soft)}
.toc-topic>button .n{color:var(--stamp);font-family:var(--f-mono);font-size:13px;min-width:1.3em;padding-top:1px}
.toc-sub{list-style:none;margin:0 0 8px;padding:0 0 0 30px}
.toc-sub button{display:block;width:100%;text-align:left;background:none;border:0;padding:4px 6px;border-radius:4px;cursor:pointer;font-family:var(--f-display);font-size:14px;color:var(--muted);line-height:1.3}
.toc-sub button:hover{color:var(--ink);background:var(--accent-soft)}
.toc-sub button[aria-current="true"]{color:var(--accent);background:var(--accent-soft);font-weight:600}
.toc-sub .n{font-family:var(--f-mono);font-size:12px;margin-right:6px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 12px}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:10px 0;font-family:var(--f-display);font-size:16px;color:var(--ink);outline:none}
.search:focus-within{border-color:var(--accent)}
.search kbd{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
select.pill{cursor:pointer}

.content{padding-block:28px 96px;padding-inline:24px;max-width:860px;width:100%}
.draft{display:flex;gap:10px;align-items:flex-start;background:var(--stamp-soft);border:1px dashed var(--stamp);border-radius:8px;padding:10px 14px;font-family:var(--f-display);font-size:14px;margin-bottom:24px;color:var(--ink)}
.draft b{color:var(--stamp);text-transform:uppercase;letter-spacing:.08em;font-size:12px;white-space:nowrap;padding-top:1px}

h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:clamp(28px,4.4vw,40px);font-weight:700}
h2{font-size:22px;font-weight:600}
h3{font-size:17px;font-weight:600}
.eyebrow{font-family:var(--f-display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:18px;color:var(--muted);max-width:62ch;margin:10px 0 0}

/* Home */
.stack{display:flex;flex-direction:column;gap:28px}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.topic-card{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;transition:border-color .15s}
.topic-card:hover{border-color:var(--accent)}
.topic-card .n{font-family:var(--f-mono);color:var(--stamp);font-size:13px}
.topic-card h3{font-size:18px}
.topic-card p{margin:0;font-size:14px;color:var(--muted);line-height:1.45}
.topic-card .count{margin-top:auto;font-family:var(--f-display);font-size:13px;color:var(--accent)}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.quick button{display:flex;gap:12px;align-items:center;text-align:left;background:var(--accent-soft);border:0;border-radius:8px;padding:12px 14px;cursor:pointer;font-family:var(--f-display);font-size:15px;font-weight:500}
.quick button:hover{outline:1px solid var(--accent)}
.quick .n{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.roles{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--f-display);font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.stats{display:flex;flex-wrap:wrap;gap:24px;font-family:var(--f-display);color:var(--muted);font-size:14px}
.stats b{display:block;font-size:26px;color:var(--ink);font-variant-numeric:tabular-nums}

/* Topic view */
.sublist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.sublist li{border-bottom:1px solid var(--line)}
.sublist button{display:grid;grid-template-columns:3.2em minmax(0,1fr) auto;gap:12px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:14px 4px;cursor:pointer}
.sublist button:hover{background:var(--accent-soft)}
.sublist .n{font-family:var(--f-mono);color:var(--stamp);font-size:14px}
.sublist .t{font-family:var(--f-display);font-size:17px;font-weight:500}
.sublist .t small{display:block;font-family:var(--f-body);font-size:14px;color:var(--muted);font-weight:400;margin-top:2px}
.sublist .tags{display:flex;gap:4px}

/* Section view */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-family:var(--f-display);font-size:14px;color:var(--muted);margin-bottom:14px}
.crumbs button{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.sec-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.sec-head .num{font-family:var(--f-mono);font-size:15px;color:var(--stamp);display:block;margin-bottom:6px}
.save{display:inline-flex;gap:6px;align-items:center;font-family:var(--f-display);font-size:14px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer}
.save[aria-pressed="true"]{border-color:var(--stamp);color:var(--stamp)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 4px}
.tag{font-family:var(--f-display);font-size:12px;letter-spacing:.03em;padding:2px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.kind{background:var(--stamp-soft);color:var(--stamp)}
.prose{max-width:65ch}
.prose p{margin:14px 0}
.prose .xref{font-family:var(--f-display);font-size:15px;background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.procedure{margin:22px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.procedure header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.procedure ol{list-style:none;margin:0;padding:0;counter-reset:step}
.procedure li{counter-increment:step;display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.procedure li:last-child{border-bottom:0}
.procedure li::before{content:counter(step);font-family:var(--f-mono);font-weight:500;color:var(--accent);background:var(--accent-soft);border-radius:50%;width:1.9em;height:1.9em;display:grid;place-items:center;font-size:13px}
.procedure li b{font-family:var(--f-display);font-weight:600}
.procedure li span{display:block;font-size:15px;color:var(--muted)}
.checklist li::before{content:"";border:2px solid var(--accent);border-radius:4px;background:transparent;width:1.2em;height:1.2em;margin-top:4px}
.related{margin-top:32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.related h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.related ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.related button{display:flex;gap:10px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-family:var(--f-display);font-size:15px}
.related button:hover{border-color:var(--accent)}
.related .n{font-family:var(--f-mono);font-size:13px;color:var(--stamp)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:36px;padding-top:18px;border-top:1px solid var(--line)}
.pager button{background:none;border:0;cursor:pointer;font-family:var(--f-display);font-size:15px;color:var(--accent);text-align:left;max-width:48%}
.pager button:last-child{text-align:right;margin-left:auto}
.pager small{display:block;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}

/* Search */
.results{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.results button{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer}
.results button:hover{border-color:var(--accent)}
.results .where{font-family:var(--f-display);font-size:13px;color:var(--muted)}
.results .t{font-family:var(--f-display);font-size:17px;font-weight:600;margin:2px 0 4px}
.results p{margin:0;font-size:15px;color:var(--muted)}
mark{background:var(--stamp-soft);color:var(--stamp);padding:0 2px;border-radius:2px}
.empty{color:var(--muted);font-family:var(--f-display)}

/* About / design notes */
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.note h3{margin-bottom:6px}
.note p{margin:0;font-size:15px;color:var(--muted)}

/* Mobile */
.tabbar{display:none}
.menu-btn{display:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font-family:var(--f-display)}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:0 auto 0 0;width:min(86vw,340px);z-index:20;transform:translateX(-105%);transition:transform .2s;height:100%;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .rail.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .menu-btn{display:inline-block}
  .topbar{padding:10px 16px;flex-wrap:nowrap}
  .search{flex:1 1 0;min-width:0}
  .content{padding-inline:16px}
  .hide-sm{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar button{background:none;border:0;padding:10px 4px;font-family:var(--f-display);font-size:13px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
  .tabbar button[aria-current="true"]{color:var(--accent);font-weight:600}
  .tabbar svg{width:22px;height:22px}
  .sublist .tags{display:none}
  .sublist button{grid-template-columns:2.8em minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>
.prose h2.sub{font-size:20px;margin:34px 0 6px;display:flex;gap:10px;align-items:baseline;scroll-margin-top:84px}
.prose h2.sub .n{font-family:var(--f-mono);font-size:14px;color:var(--stamp);font-weight:500}
.prose h2.sub.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:var(--stamp-soft)}100%{background:transparent}}
.li{display:grid;grid-template-columns:2.6em minmax(0,1fr);gap:4px;margin:8px 0}
.li .mk{font-family:var(--f-mono);font-size:13px;color:var(--muted);padding-top:3px}
.li.lv1 .mk{color:var(--accent);font-weight:500}
.li.d1{margin-left:2.2em}.li.d2{margin-left:4.4em}
@media (max-width:560px){.li.d1{margin-left:1.2em}.li.d2{margin-left:2.4em}}
.notehead{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:18px}
.term{border:0;background:none;padding:0;font:inherit;color:inherit;border-bottom:1.5px dotted var(--accent);cursor:help}
.pop{position:absolute;z-index:30;max-width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.18);font-size:15px;line-height:1.5}
.pop b{display:block;font-family:var(--f-display);font-size:15px;margin-bottom:4px;color:var(--accent)}
.pop button{margin-top:8px;font-family:var(--f-display);font-size:13px;background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline}
.figure{display:flex;gap:10px;align-items:center;font-family:var(--f-display);font-size:14px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:10px 14px;margin:12px 0}
.flowwrap{margin:16px 0 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px 16px}
.flowtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 0;align-items:stretch}
.flow li{display:flex;align-items:center;font-family:var(--f-display);font-size:14px}
.flow li span{background:var(--accent-soft);color:var(--ink);border-radius:6px;padding:7px 10px;line-height:1.2}
.flow li.end span{background:var(--ink);color:var(--surface)}
.flow li.opt span{background:transparent;border:1px dashed var(--accent)}
.flow li:not(:last-child)::after{content:"→";color:var(--accent);padding:0 6px}
.flowkey{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-family:var(--f-display);font-size:13px;color:var(--muted)}
.flowkey .deny{color:var(--stamp)}
.gloss{display:grid;grid-template-columns:minmax(0,1fr);gap:0;border-top:1px solid var(--line)}
.gloss div{padding:12px 2px;border-bottom:1px solid var(--line);scroll-margin-top:84px}
.gloss dt{font-family:var(--f-display);font-weight:600;font-size:17px}
.gloss dd{margin:2px 0 0;color:var(--muted);max-width:65ch}
.foot{margin-top:48px;padding-top:14px;border-top:1px solid var(--line);font-family:var(--f-display);font-size:13px;color:var(--muted)}
.results .where .n{font-family:var(--f-mono);color:var(--stamp)}
</style>

</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="Manual contents">
    <button class="brand" data-go="home"><span>EAC · One Stop Border Posts</span><b>Procedures Manual</b><span style="letter-spacing:.04em;text-transform:none">2nd edition, September 2023</span></button>
    <div id="toc"></div>
  </nav>
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" aria-controls="rail" aria-expanded="false">☰ Contents</button>
      <label class="search" for="q">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="Search: e.g. body search, fast track, firearms" autocomplete="off">
        <kbd class="hide-sm">/</kbd>
      </label>
      <select class="pill hide-sm" id="lang" aria-label="Language">
        <option>English</option><option disabled>Kiswahili (planned)</option><option disabled>Français (planned)</option><option disabled>Ikinyarwanda (planned)</option>
      </select>
      <span class="pill hide-sm" title="Prototype: the production build caches the manual for offline use"><span class="dot"></span>Saved for offline</span>
    </div>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>
<nav class="tabbar" aria-label="Sections">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Manual</button>
  <button data-tab="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Search</button>
  <button data-tab="glossary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>Terms</button>
  <button data-tab="saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Saved</button>
</nav>

<script type="application/json" id="data">{"glossary": [{"term": "adjoining Partner State", "def": "a Partner State whose officers perform border controls within the control zone in the host Partner State"}, {"term": "authorized economic operator", "def": "a trusted trader or transport operator that is accredited for expedited and simplified border crossing clearance on the basis of his or her provision of a collateral guarantee and/or a good compliance record"}, {"term": "border control agency", "def": "public authority charged with the application and enforcement of border crossing related laws and regulations in its field of competence"}, {"term": "border controls", "def": "any border-related control measures, checks, and authorizations, without limitation, provided for in the national laws and regulations of the Partner States"}, {"term": "BMC", "def": "refers to the Border Management Committee, whose objective is to oversee the implementation and operations at the border on one side of the country."}, {"term": "BOSC", "def": "refers to the Bilateral OSBPs Steering Committee, which has the responsibility of overseeing the implementation and operations of all one stop border posts between such adjoining Partner States."}, {"term": "Community", "def": "the East African Community established under Article 2 of the Treaty"}, {"term": "competent authorities", "def": "any ministries or other government entities of the Partner States assigned responsibilities for border controls by their national laws"}, {"term": "control zone", "def": "the territory of the host Partner State within which officers of the adjoining Partner States effect border controls, including the exclusive use area"}, {"term": "customs declaration", "def": "a statement showing goods being imported, exported, transited, or transferred on which duty may have to be paid"}, {"term": "disinfection", "def": "the procedure whereby health measures are taken to control or kill the insect vectors of human diseases present in baggage, cargo, containers, conveyances, goods, and postal parcels."}, {"term": "exclusive use area", "def": "that area of the control zone dedicated for the exclusive use of the adjoining Partner State"}, {"term": "extraterritoriality", "def": "that the performance of duties by a public official of the adjoining Partner State in the control zone of the host Partner State is considered to occur in the official’s home state territory for the purpose of the application of the law"}, {"term": "facilitation agents", "def": "any person other than an officer, providing services to the completion of border controls by passengers or freight in accordance with the national laws of the Partner States"}, {"term": "facilities", "def": "any border control processing areas, office and other accommodation space, storerooms, offloading bays and warehouses, official parking lots, sanitation, food and other utility areas provided for use by officers of the adjoining Partner States and the various publics in the one stop border post control zone"}, {"term": "free pratique", "def": "an authorization for disembarkation or embarkation granted by the health authorities upon declaration and verification of absence of contagious disease or contamination"}, {"term": "gate pass", "def": "the (paper or electronic) document issued by the office of the lead agency of the entry state or any other agency as may be designated, confirming the completion of all border crossing control requirements and allowing the holder and his/her vehicle and goods as the case may be to exit the control zone into the Partner State of immediate destination"}, {"term": "hazardous goods", "def": "substances that have the potential of causing damage to public health, the environment, infrastructure, or equipment, as defined in the United Nations Recommendations on the Transport of Dangerous Goods, also called the Orange Book, and the European Agreement concerning the International Carriage of Dangerous Goods by Road (ADR), done at Geneva on 30 September 1957"}, {"term": "home Partner State", "def": "the Partner State in whose service the officer acts and the Partner State where the private sector product or service provider is established"}, {"term": "host Partner State", "def": "the Partner State in whose territory the border controls of the adjoining Partner State are effected"}, {"term": "hot pursuit", "def": "the right for authorities of an adjoining state for the purpose of law enforcement to continue the uninterrupted pursuit of suspected criminals from their national territory into the territory of the other adjoining state, as bilaterally agreed by the adjoining Partner States"}, {"term": "inter-agency", "def": "between the border control agencies"}, {"term": "isolation", "def": "separation of ill or contaminated persons or affected baggage, containers, conveyances, goods, postal parcels from others in such a manner as to prevent the spread of infection or contamination"}, {"term": "JBOC", "def": "stands for the Joint Border Operations Committee, a collaborative committee formed by two adjoining Parter States. Its primary purpose is to jointly oversee and supervise operations at a border post."}, {"term": "jurisdiction", "def": "power or competence of a government agency to apply and enforce its national laws and regulations"}, {"term": "law enforcement agency", "def": "any person or agency empowered by the national laws of a Partner State to enforce those laws"}, {"term": "lead agency", "def": "the border control agency designated by each Partner State to assume the role and responsibilities in terms of these Regulations and any bilateral agreement between adjoining Partner States"}, {"term": "NOSC", "def": "stands for the National OSBP Steering Committee, which serves as the oversight body responsible for managing the implementation and operations of all one stop border posts at Partner State level."}, {"term": "officer", "def": "a person responsible for conducting border controls in accordance with the national laws of the Partner States or the laws of the Community"}, {"term": "one stop border post", "def": "a border post established under Section 4 of the East African Community One Stop Border Posts Act, 2016"}, {"term": "Partner State", "def": "the Republic of Burundi, the Republic of Kenya, the Republic of Rwanda, the Republic of South Sudan, the Republic of Uganda, the United Republic of Tanzania, and any other country granted membership to the Community under Article 3 of the Treaty"}, {"term": "perishable goods", "def": "(i) products that are vulnerable to easy deterioration beyond marketability or to death under the combined effect of duration and conditions of transport, such as temperature (heat or cold), humidity or drought, or movement, and (ii) time-sensitive goods with a limited expiry date, which even when physically intact may lose their commercial value over time"}, {"term": "quarantine", "def": "restriction of activities and/or separation from others of persons, animals, and plant and plant products that are not ill or contaminated, or suspect baggage, containers, conveyances, goods, or other inanimate objects, in such a manner as to prevent the possible spread of infection or contamination"}, {"term": "risk management", "def": "a management technique for identifying, profiling, and assessing the risks faced by an organization with the aim of achieving an efficient balance between opportunities for gains and mitigation of vulnerabilities"}, {"term": "ROSC", "def": "stands for the Regional OSBPs Steering Committee, a high-leve,, multi- sectoral steering committee dedicated to overseeing one stop border posts within the Community."}, {"term": "single window system", "def": "a facility that allows parties involved in trade and transport to lodge standardized information and documents with a single entry point to fulfil all import, export and transit related regulatory requirements"}, {"term": "transshipment", "def": "transfer, either directly or indirectly, of any goods from a vehicle arriving in a Partner State from another Partner State, to a vehicle, departing to another Partner State"}, {"term": "Treaty", "def": "the Treaty for the Establishment of the East African Community"}, {"term": "user", "def": "the traveller, transport operator, pedestrian, driver, or other vehicle crew member, intending to cross the border."}], "chapters": [{"n": 1, "title": "Introduction", "sections": [{"id": "1.1", "title": "Background", "blocks": [{"t": "p", "text": "The establishment of one stop border posts (OSBPs) in the East African Community (EAC) is part of the East African Trade and Transport Facilitation Project (EATTFP), which was conceptualized in 2006 as a component of the EAC infrastructure development program. Under the EATTFP framework, the EAC, in conjunction with international development partners, identified several border posts across the region for conversion to OSBPs to facilitate trade and transport to enhance regional integration."}, {"t": "p", "text": "In 2010, the EAC developed a policy paper on OSBPs and commenced the development of regional legal instruments for OSBP operations. Partner States that completed the construction of OSBP facilities prior to the conclusion of the development of regional legal instruments operationalized the OSBPs using bilateral agreements, which were later replaced by the regional law, the EAC One-Stop Border Posts Act, 2016. In order to enable uniform interpretation and application of the provisions of regional legal instruments on OSBPs, the EAC has developed the East African Community One Stop Border Posts Procedures Manual."}]}, {"id": "1.2", "title": "Objective of the Manual", "blocks": [{"t": "p", "text": "The overall purpose of the Manual is to serve as a guide of good practice for efficient execution of operations in OSBPs. Specifically, it has been developed for use by border agency officers and border facilitation agents, and to provide information to private sector users and the general public."}]}, {"id": "1.3", "title": "Scope", "blocks": [{"t": "p", "text": "These procedures have been designed to take into account the variations of OSBP facilities and circumstances. Specific procedures for operations unique to pairs of adjoining Partner States are provided in the respective bilateral agreements. The Manual applies only to road transport operations in OSBPs that have been established at internal borders between Partner States of the EAC. The procedures realize the strict minimum in terms of trade and transport facilitation and higher levels of trade and transport facilitation are conceivable."}]}, {"id": "1.4", "title": "Legal and Policy Framework", "blocks": [{"t": "p", "text": "The procedures in this manual are in accordance with the East African Community One Stop Border Posts Act, 2016 (hereafter referred to as the Act), and the East African Community One Stop Border Posts Regulations, 2017 (hereafter referred to as the Regulations). In addition to the Act and the Regulations, the Manual is aligned to a wider legal and policy framework, including the following instruments, among others:"}, {"t": "li", "mk": "i", "lv": 2, "text": "Treaty for the Establishment of the East African Community, 1999 (Chapter 2, Articles 5 and 7; Chapter 11; Chapter 15, Articles 89 and 90);"}, {"t": "li", "mk": "ii", "lv": 2, "text": "East African Community Customs Management Act, 2004 (as amended);"}, {"t": "li", "mk": "iii", "lv": 2, "text": "Protocol on the Establishment of the East African Community Customs Union, 2004;"}, {"t": "li", "mk": "iv", "lv": 2, "text": "East African Community Standardisation, Quality Assurance, Metrology and Testing Act, 2006;"}, {"t": "li", "mk": "v", "lv": 2, "text": "Protocol on the Establishment of the East African Community Common Market, 2009;"}, {"t": "li", "mk": "vi", "lv": 2, "text": "East African Community Common Market (Free Movement of Persons) Regulations, Annex I, 2009;"}, {"t": "li", "mk": "vii", "lv": 2, "text": "East African Community Customs Regulations, 2010;"}, {"t": "li", "mk": "viii", "lv": 2, "text": "East African Community Customs Union (Rules of Origin) Rules, 2015;"}, {"t": "li", "mk": "ix", "lv": 2, "text": "the International Health Regulations, 2005, of the World Health Organization; and"}, {"t": "li", "mk": "x", "lv": 2, "text": "the Trade Facilitation Agreement, 2013, of the World Trade Organization."}]}]}, {"n": 2, "title": "Institutional Frameworks", "sections": [{"id": "2.1", "title": "Introduction", "blocks": [{"t": "p", "text": "Part IX, Chapter 50 of the EAC OSBP Act, 2016 mandates the Council to appoint relevant Community institutions to undertake specific tasks with respect to OSBPs. Pursuant to this provision of the Act, The 39th meeting of the Sectoral Council on Trade, Industry, Finance, and Investment held on 12th November 2021:"}, {"t": "li", "mk": "a", "lv": 3, "text": "decided to establish a Regional OSBPs Steering Committee (EAC/SCTIFI 39/Decision 10); and"}, {"t": "li", "mk": "b", "lv": 3, "text": "directed Partner States to establish and operationalize Bilateral OSBPs Steering Committees (BOSC), National OSBPs Steering Committee (NOSC) and Joint Border Operations Committees (EAC/SCTIFI 39/Directive 09)."}, {"t": "p", "text": "In this regard, the following committees shall be established in the listed hierarchical order:"}, {"t": "li", "mk": "i", "lv": 2, "text": "Regional OSBPs Steering Committee (ROSC) at the EAC level;"}, {"t": "li", "mk": "ii", "lv": 2, "text": "Bilateral OSBPs Steering Committees (BOSCs) between adjoining Partner States;"}, {"t": "li", "mk": "iii", "lv": 2, "text": "National OSBPs Steering Committee (NOSC) in each Partner State;"}, {"t": "li", "mk": "iv", "lv": 2, "text": "Joint Border Operations Committees (JBOCs) between adjoining Partner States; and"}, {"t": "li", "mk": "v", "lv": 2, "text": "Border Management Committee (BMC) at borders."}]}, {"id": "2.2", "title": "Key elements for the establishment and operationalization of the Institutional Frameworks", "blocks": [{"t": "p", "text": "In order to effectively establish and operationalize institutional frameworks, it is essential to consider the following key elements:"}, {"t": "li", "mk": "i", "lv": 2, "text": "Objectives of the established institutional bodies;"}, {"t": "li", "mk": "ii", "lv": 2, "text": "Organization and structure"}, {"t": "li", "mk": "iii", "lv": 2, "text": "The roles and responsibilities of the bodies;"}, {"t": "li", "mk": "iv", "lv": 2, "text": "Composition and Meetings of the committees"}, {"t": "li", "mk": "v", "lv": 2, "text": "Financing of the bodies; and"}, {"t": "li", "mk": "vi", "lv": 2, "text": "Other pertinent issues as shall be directed by policy organs of the EAC."}]}, {"id": "2.3", "title": "Objectives of the Establishment of Institutional Bodies", "blocks": [{"t": "p", "text": "1) Establishment of institutional bodies at various levels is aimed at:"}, {"t": "p", "text": "I. Improving the efficiency of operations at the OSBPs; II. Improving the resolution of issues arising between Partner States; III. Identify and address the challenges encountered at borders; and IV. Develop an effective communication and reporting mechanism within the OSBP Framework."}, {"t": "p", "text": "Organization Structure of the committees"}, {"t": "p", "text": "The chart below outlines the reporting lines between the committees."}, {"t": "p", "text": "2) Respective institutional bodies may opt to establish subcommittees or technical working groups in various areas such as Security, Legal, Infrastructure, ICT, Procedures, and Training."}, {"t": "p", "text": "3) Institutional bodies should be involved early in the course of OSBP development. At the border level, during the planning, design and construction phase of an OSBP, a Project Management Team/Committee should be established to ensure that future users are involved throughout the process. Consideration should be given to the long-term maintenance cost of the OSBP facility, which will be the responsibility of the lead agency (or facility manager) during the operational phase."}]}, {"id": "2.4", "title": "Roles and Responsibilities of Institutional Bodies", "blocks": [{"t": "p", "text": "Each committee has distinct roles and responsibilities, as outlined below."}, {"t": "h", "id": "2.4.1", "text": "ROSC"}, {"t": "li", "mk": "i", "lv": 2, "text": "Coordinate the establishment of OSBPs within the Community to ensure uniformity of approach in the implementation of the OSBP concept between adjoining Partner States;"}, {"t": "li", "mk": "ii", "lv": 2, "text": "Monitor the implementation of OSBPs at the various borders within the Community to ensure full compliance with the provisions of the Act and Regulations;"}, {"t": "li", "mk": "iii", "lv": 2, "text": "Set specific programmes for the establishment, implementation and operation of one stop border controls at existing and future border posts within the Community;"}, {"t": "li", "mk": "iv", "lv": 2, "text": "Initiate policies for the improvement of the efficiencies of Community OSBPs and any related trade facilitation matters;"}, {"t": "li", "mk": "v", "lv": 2, "text": "Resolve any issues referred to the ROSC by the BOSCs;"}, {"t": "li", "mk": "vi", "lv": 2, "text": "Account and be responsible to the Council through the relevant Sectoral Committee on all issues relating to OSBPs;"}, {"t": "li", "mk": "vii", "lv": 2, "text": "Perform such other functions as may be prescribed by the Council; and"}, {"t": "li", "mk": "viii", "lv": 2, "text": "Provide directives regarding the matters referred to by the subordinate committee."}, {"t": "h", "id": "2.4.2", "text": "BOSC"}, {"t": "li", "mk": "i", "lv": 2, "text": "Coordinate and determine the administrative measures necessary for the implementation of OSBPs by adjoining Partner States and resolve any difficulties that may arise from such implementation;"}, {"t": "li", "mk": "ii", "lv": 2, "text": "Resolve any issues referred to the BOSC by the NOSCs;"}, {"t": "li", "mk": "iii", "lv": 2, "text": "Constitute bilateral operational and administrative committees and sub- committees comprising Officers of the adjoining Partner States directly involved in undertaking border controls at each OSBP;"}, {"t": "li", "mk": "iv", "lv": 2, "text": "Co-opt other government agencies and the private sector at each OSBP into such operational and administrative sub-committees to ensure valuable contribution and feedback from the relevant private sector stakeholders;"}, {"t": "li", "mk": "v", "lv": 2, "text": "Monitor the implementation and performance of OSBPs under its jurisdiction and routinely report on progress and other relevant matters to the ROSC through appropriate national structures; and"}, {"t": "li", "mk": "vi", "lv": 2, "text": "Provide directives regarding the matters referred to by the subordinate committee."}, {"t": "h", "id": "2.4.3", "text": "NOSC"}, {"t": "li", "mk": "i", "lv": 2, "text": "Oversee the implementation and operations of all OSBPs at Partner State level;"}, {"t": "li", "mk": "ii", "lv": 2, "text": "Determine the administrative measures necessary for the implementation of OSBPs in Partner State;"}, {"t": "li", "mk": "iii", "lv": 2, "text": "Resolve any difficulties that may arise from such implementation;"}, {"t": "li", "mk": "iv", "lv": 2, "text": "Analyze and solve problems that have been referred to it by the JBOCs;"}, {"t": "li", "mk": "v", "lv": 2, "text": "Ensure effective coordination and complementarity in offering quality services; Ensure good management and maintenance of the OSBP property;"}, {"t": "li", "mk": "vi", "lv": 2, "text": "Report issues beyond its mandate to the BOSC; and"}, {"t": "li", "mk": "vii", "lv": 2, "text": "Provide directives regarding the matters referred to by the subordinate committee."}, {"t": "h", "id": "2.4.4", "text": "JBOC"}, {"t": "li", "mk": "i", "lv": 2, "text": "Oversee and supervise the OSBP to ensure effective implementation according to the EAC instruments;"}, {"t": "li", "mk": "ii", "lv": 2, "text": "Be responsible for day-to-day operations of the OSBP;"}, {"t": "li", "mk": "iii", "lv": 2, "text": "Resolve issues that arise in the daily operation of the OSBP and to seek continuous improvement in operations;"}, {"t": "li", "mk": "iv", "lv": 2, "text": "Ensure that each control zone is managed by a competent authority of the host state assisted by a competent authority of the adjoining state;"}, {"t": "li", "mk": "v", "lv": 2, "text": "Ensure the OSBPs is operating as per the legal framework governing the OSBP;"}, {"t": "li", "mk": "vi", "lv": 2, "text": "Analyze and solve problems that could hinder the smooth operation of the OSBP;"}, {"t": "li", "mk": "vii", "lv": 2, "text": "Ensure effective coordination and complementarity in offering quality services;"}, {"t": "li", "mk": "viii", "lv": 2, "text": "Ensure good management and maintenance of the OSBP property;"}, {"t": "li", "mk": "ix", "lv": 2, "text": "Inform and coordinate with the head offices of the partner border control agencies represented at the OSBP;"}, {"t": "li", "mk": "x", "lv": 2, "text": "It is recommended to set up a Complaints handling mechanism, where border users can register any grievance, they may have with the services at the borders;"}, {"t": "li", "mk": "xi", "lv": 2, "text": "Installation of an information officer or desk at the OSBP is also recommended. This office shall act as a liaison with the public and will disseminate information appropriately;"}, {"t": "li", "mk": "xii", "lv": 2, "text": "Communicate proposals and report issues requiring guidance for further action by NOSCs; and (xiii)Provide directives regarding the matters referred to by the subordinate committee."}, {"t": "h", "id": "2.4.5", "text": "BMC"}, {"t": "li", "mk": "i", "lv": 2, "text": "Deliberate on inter-agency and national issues at the border;"}, {"t": "li", "mk": "ii", "lv": 2, "text": "Be responsible for day-to-day operations of the OSBP;"}, {"t": "li", "mk": "iii", "lv": 2, "text": "Provide oversight and supervision of the OSBP, addressing any challenges that arise in the daily operations to ensure effective implementation; and"}, {"t": "li", "mk": "iv", "lv": 2, "text": "Report issues requiring guidance for further action by JBOC and NOSC."}]}, {"id": "2.5", "title": "Composition and Meetings of the committees", "blocks": [{"t": "p", "text": "Each committee's composition and representation are as follows:"}, {"t": "h", "id": "2.5.1", "text": "ROSC"}, {"t": "li", "mk": "i", "lv": 2, "text": "The ROSC shall be a multi-sectoral high level steering committee on OSBPs, comprising equal numbers of Representatives of the competent authorities or institutions and private sector from each Partner State;"}, {"t": "li", "mk": "ii", "lv": 2, "text": "Each Partner State shall nominate three representatives not below the level of Director or equivalent to the ROSC;"}, {"t": "li", "mk": "iii", "lv": 2, "text": "The EAC Secretariat shall coordinate the convening of the ROSC meetings and shall prepare reports of the proceedings;"}, {"t": "li", "mk": "iv", "lv": 2, "text": "ROSC shall meet at least twice a year and shall alternate the venues of its meetings among each of the Partner States and the EAC Secretariat Headquaters;"}, {"t": "li", "mk": "v", "lv": 2, "text": "The chairmanship of the ROSC shall rotate in line with established rules of procedures of chairing Community organs and institutions; and"}, {"t": "li", "mk": "vi", "lv": 2, "text": "ROSC shall regulate its own meetings and rules of procedure and shall adopt its decisions by consensus. In the event of failure to reach consensus, the ROSC shall refer such matters to the Council through the relevant Sectoral Council;"}, {"t": "h", "id": "2.5.2", "text": "BOSC"}, {"t": "li", "mk": "i", "lv": 2, "text": "BOSC shall be composed of the members of the NOSC or equivalent structures of the adjoining Partner States to oversee the implementation and operations of all OSBPs between such adjoining Partner States;"}, {"t": "li", "mk": "ii", "lv": 2, "text": "BOSCs shall meet as often as they may require and alternate the locality of the meetings between the territories of the adjoining Partner States, unless agreed otherwise;"}, {"t": "li", "mk": "iii", "lv": 2, "text": "The meetings of the BOSCs shall be chaired by host Minister responsible for EAC Affairs and co-chaired by the counterpart minister of the adjoining Partner State;"}, {"t": "li", "mk": "iv", "lv": 2, "text": "BOSCs shall establish their own rules of procedure at such meetings; and"}, {"t": "li", "mk": "v", "lv": 2, "text": "BOSCs shall adopt their decisions by consensus. In the event of failure to reach consensus, or where an issue is of regional nature, the BOSCs shall refer the matter to ROSC for resolution."}, {"t": "h", "id": "2.5.3", "text": "NOSC"}, {"t": "li", "mk": "i", "lv": 2, "text": "The NOSC shall be composed of high-level Officials of Border Regulation Agencies and any other institution operating at the OSBPs as may be decided by each Partner State;"}, {"t": "li", "mk": "ii", "lv": 2, "text": "NOSC may co-opt representatives from the private sector and any other expert as it may deem necessary;"}, {"t": "li", "mk": "iii", "lv": 2, "text": "NOSCs shall meet as often as they may require;"}, {"t": "li", "mk": "iv", "lv": 2, "text": "The meetings of the NOSCs shall be chaired by Ministry responsible for EAC Affairs, unless determined otherwise by a Partner State; and"}, {"t": "li", "mk": "v", "lv": 2, "text": "NOSCs shall develop or establish their own rules of procedure at such meetings."}, {"t": "h", "id": "2.5.4", "text": "JBOC"}, {"t": "li", "mk": "i", "lv": 2, "text": "The JBOC shall be composed of a representative of each border control agency operating in the shared control zones;"}, {"t": "li", "mk": "ii", "lv": 2, "text": "The JBOC shall meet at least quarterly or ad hoc if need arises;"}, {"t": "li", "mk": "iii", "lv": 2, "text": "The JBOC meetings shall be chaired by the representative of the Lead Agency of the host Partner State, unless agreed otherwise mutually;"}, {"t": "li", "mk": "iv", "lv": 2, "text": "Joint secretaries, represented by both Partner States, shall be appointed for the purpose of taking minutes of meetings and keeping record;"}, {"t": "li", "mk": "v", "lv": 2, "text": "Report on quarterly basis or as required by the NOSC from time to time on actions undertaken by the JBOC and performance targets achieved at the border;"}, {"t": "li", "mk": "vi", "lv": 2, "text": "Invite where necessary representatives of private sector involved in border crossing operations or responsible for providing specific services in the OSBP to participate in the meetings; and"}, {"t": "li", "mk": "vii", "lv": 2, "text": "Prepare and circulate minutes of meetings within one week."}, {"t": "h", "id": "2.5.5", "text": "BMC"}, {"t": "li", "mk": "i", "lv": 2, "text": "The way of managing and conducting meetings in the BMC is basically the same as in the JBOC, but it is composed of regulatory agencies at the border; and"}, {"t": "li", "mk": "ii", "lv": 2, "text": "BMC may conduct quarterly public stakeholder engagements and escalate their issues to the relevant organs."}]}, {"id": "2.6", "title": "Financing of the Bodies", "blocks": [{"t": "p", "text": "All Partner States shall cover the costs related to functioning of the institutional bodies except ROSC."}, {"t": "h", "id": "2.6.1", "text": "ROSC"}, {"t": "p", "text": "The EAC Secretariat shall cover the expenses incurred in running the ROSC."}, {"t": "h", "id": "2.6.2", "text": "BOSC"}, {"t": "p", "text": "The expenses for operating the BOSC will be shared between the adjoining Partner States."}, {"t": "h", "id": "2.6.3", "text": "NOSC"}, {"t": "p", "text": "The expenses to run the NOSC shall be catered for by the lead agency."}, {"t": "h", "id": "2.6.4", "text": "JBOC"}, {"t": "p", "text": "The costs associated with running the JBOC will be shared between the adjoining countries. These costs will be met by the lead agencies on a reciprocal basis."}, {"t": "h", "id": "2.6.5", "text": "BMC"}, {"t": "p", "text": "The operational expenses for running the BMC will be catered for by the lead agency."}]}, {"id": "2.7", "title": "Other Pertinent Issues", "blocks": [{"t": "h", "id": "2.7.1", "text": "Lead Agency"}, {"t": "li", "mk": "1", "lv": 1, "text": "Appointment: It is recommended that each adjoining Partner State designate one of its border control agencies operating at each of its OSBPs as the lead agency, in accordance with Part II, Chapter 3 of the OSBP Regulations 2017. The officer in charge of the lead agency at each OSBP assumes direct responsibilities and tasks, as enumerated in (2)."}, {"t": "li", "mk": "2", "lv": 1, "text": "Tasks: Lead agencies are to assume and be accountable to their national hierarchy for the following tasks:"}, {"t": "li", "mk": "i", "lv": 2, "text": "Coordinating all the national border control agencies operating at the OSBP;"}, {"t": "li", "mk": "ii", "lv": 2, "text": "Acting as the operational and administrative liaison point with the adjoining Partner State at the OSBP;"}, {"t": "li", "mk": "iii", "lv": 2, "text": "Collaborating with the lead agency of the adjoining Partner State to coordinate all joint operations at the OSBP, including single window operations, joint inspections and verifications, ICT connectivity and data exchange systems, collection and analysis of data relating to border efficiency and targets, joint operational training initiatives, and any other related operations;"}, {"t": "li", "mk": "iv", "lv": 2, "text": "Working with the lead agency of the adjoining Partner State to coordinate all joint administrative issues at the OSBP, including arrangement and chairing of joint coordination meetings and administration, and maintenance of all joint use and public use facilities and equipment, organization of joint social and cultural activities, and any other issues as may be agreed between the adjoining Partner States;"}, {"t": "li", "mk": "v", "lv": 2, "text": "Being the focal point for all public users of the OSBP, ensuring the intended benefits are delivered, and registering and resolving any complaints from such publics;"}, {"t": "li", "mk": "vi", "lv": 2, "text": "Ensuring that the facilities and equipment allocated to its national agencies in the OSBP are properly maintained and kept in good condition for use by those charged with the responsibilities to do so; coordination, in consultation with the adjoining Partner State’s lead agency, of all official visits by any national institutions and stakeholders to the OSBP; and"}, {"t": "li", "mk": "vii", "lv": 2, "text": "Undertaking any other responsibilities as may be specified in this Manual and bilateral agreements between the adjoining Partner States."}, {"t": "li", "mk": "3", "lv": 1, "text": "Notwithstanding the designation of a lead agency and its responsibilities, each border control agency remains responsible and accountable to its agency hierarchy under its enabling national laws for the proper discharge of its responsibilities and conduct of its border control functions."}, {"t": "li", "mk": "4", "lv": 1, "text": "In carrying out its responsibilities under this regulation, the designated lead agency pursues the achievement of the objectives of the Act and the Regulations."}, {"t": "li", "mk": "5", "lv": 1, "text": "The designation as lead agency in no way mandates the lead agency with any powers of operational control over the other agencies operating at the OSBP beyond a coordination role."}, {"t": "h", "id": "2.7.2", "text": "Bilateral Arrangements"}, {"t": "p", "text": "Partner States may put in place bilateral arrangements to cater for specific issues related to OSBP operations."}]}]}, {"n": 3, "title": "Principles of OSBPs", "sections": [{"id": "3", "title": "Principles of OSBPs", "blocks": [{"t": "p", "text": "In order to achieve its goal, the following principles govern the functioning of OSBPs and are elaborated in subsequent chapters:"}, {"t": "li", "mk": "i", "lv": 2, "text": "Only one stop by users for both exit and entry clearance controls;"}, {"t": "li", "mk": "ii", "lv": 2, "text": "Establishment of a control zone combining exit and entry controls;"}, {"t": "li", "mk": "iii", "lv": 2, "text": "Sequential handover of controls from the country of exit to the country of entry, nnotwithstanding the joint execution of controls;"}, {"t": "li", "mk": "iv", "lv": 2, "text": "Direct movement of border crossing traffic to the control zone of the country of entry;"}, {"t": "li", "mk": "v", "lv": 2, "text": "Proper traffic management according to categories of users;"}, {"t": "li", "mk": "vi", "lv": 2, "text": "Use of appropriate signage to guide the users at OSBPs;"}, {"t": "li", "mk": "vii", "lv": 2, "text": "Completion of exit procedures before entry procedures;"}, {"t": "li", "mk": "viii", "lv": 2, "text": "Reliance of the adjoining Partner State upon the host Partner State for security and management of the portion of the control on the exit side of the OSBP;"}, {"t": "li", "mk": "ix", "lv": 2, "text": "Synchronization of operating hours;"}, {"t": "li", "mk": "x", "lv": 2, "text": "State-to-state or agency-to-agency nature of OSBP procedures;"}, {"t": "li", "mk": "xi", "lv": 2, "text": "Implementation of mechanisms for inter-agency coordination and joint operations;"}, {"t": "li", "mk": "xii", "lv": 2, "text": "Information sharing, automation, and ICT interconnectivity, to the extent practicable;"}, {"t": "li", "mk": "xiii", "lv": 2, "text": "Extraterritorial application of national laws in the control zone in the host Partner State;"}, {"t": "li", "mk": "xiv", "lv": 2, "text": "Jurisdiction of the adjoining Partner States on designated access routes between any adjoining Partner States, which are part of the control zone in the same way as specified for control zones;"}, {"t": "li", "mk": "xv", "lv": 2, "text": "Allocation by the host Partner State to the adjoining Partner State of adequate and comparable facilities on the basis of indicated needs; and"}, {"t": "li", "mk": "xvi", "lv": 2, "text": "Application of risk management by border agencies to facilitate operations at OSBPs, in accordance with international standards."}]}]}, {"n": 4, "title": "OSBP Facilities", "sections": [{"id": "4", "title": "OSBP Facilities", "blocks": [{"t": "p", "text": "In terms of physical facilities, the operation of an OSBP is based on the establishment of a control zone with exclusive use areas serving each Partner State, in one of the following configurations:"}]}, {"id": "4.1", "title": "Configuration of OSBP Facilities", "blocks": [{"t": "p", "text": "The physical configuration of OSBP facilities may be one of the following types: juxtaposed, straddled, or wholly located. While in most cases the juxtaposed configuration will be adopted, the procedures set out in the Manual apply in all three configurations."}, {"t": "li", "mk": "1", "lv": 1, "text": "Juxtaposed: The OSBP facilities of the adjoining Partner States are located in their respective national territories but positioned in close proximity (as practicable) across the borderline and are used jointly. This is the most common configuration within the EAC."}, {"t": "p", "text": "Border State A Exit State B State B Enter State A"}, {"t": "p", "text": "ONE STOP"}, {"t": "p", "text": "ONE STOP Exit State A Enter State B"}, {"t": "p", "text": "Note: The figure shows the case of vehicles driving on the right. It should be reversed in the case of vehicles driving on the left."}, {"t": "li", "mk": "2", "lv": 1, "text": "Straddled: A single OSBP facility is established across a borderline for joint use by the adjoining Partner States."}, {"t": "p", "text": "Border State A Exit State B State B Enter State A"}, {"t": "p", "text": "ONE STOP"}, {"t": "p", "text": "Exit State A Enter State B Note: The figure shows the case of vehicles driving on the right. It should be reversed in the case of vehicles driving on the left."}, {"t": "li", "mk": "3", "lv": 1, "text": "Wholly Located: The joint OSBP facility is situated entirely in the territory of one of the adjoining Partner States for joint use."}, {"t": "p", "text": "Exit State B Border State A Enter State A State B"}, {"t": "p", "text": "ONE STOP"}, {"t": "p", "text": "Exit State A Enter State B Note: The figure shows the case of vehicles driving on the right. It should be reversed in the case of vehicles driving on the left."}]}, {"id": "4.2", "title": "The Control Zone and Exclusive Use Areas", "blocks": [{"t": "h", "id": "4.2.1", "text": "The Control Zone"}, {"t": "li", "mk": "1", "lv": 1, "text": "A control zone has gate(s) for entry and gate(s) for exit. The control zone and its designated access and exit roads are physically secured by devices preventing unauthorized entry or exit."}, {"t": "li", "mk": "2", "lv": 1, "text": "The public is informed about the restricted area of the control zone by appropriate signage in relevant languages and in an adequate perimeter so as to deter potential intruders."}, {"t": "li", "mk": "3", "lv": 1, "text": "Within the control zone, counterpart agency facilities should ideally be located in close proximity so as to avoid time loss by users."}, {"t": "li", "mk": "4", "lv": 1, "text": "In the case of an OSBP with a juxtaposed or straddled configuration, the control zone extends across the borderline. In the case of an OSBP with a wholly located configuration, the control zone is on one side of the borderline with separate control points for each direction of movement."}, {"t": "h", "id": "4.2.2", "text": "Exclusive Use Areas"}, {"t": "li", "mk": "1", "lv": 1, "text": "Within the control zone, exclusive use areas are reserved solely for use by the officials of each adjoining Partner State for detailed border clearance."}, {"t": "li", "mk": "2", "lv": 1, "text": "The exclusive use areas are clearly marked and identified through the display of official national signs, such as flags, coats of arms, portraits of Heads of State, and signage."}, {"t": "li", "mk": "3", "lv": 1, "text": "The exclusive use areas are for the purposes of offices, administration, electronic systems control, storage, profiling, and detention."}, {"t": "li", "mk": "4", "lv": 1, "text": "Officers of the adjoining Partner States are empowered to control the entry and exit of traffic and maintain order within their exclusive use areas."}, {"t": "li", "mk": "5", "lv": 1, "text": "Host Partner State authorities have no access to the exclusive use area of the adjoining Partner State, except on express request of or invitation from authorized officials of the adjoining Partner State."}, {"t": "li", "mk": "6", "lv": 1, "text": "When required by circumstances and by special arrangement with the host Partner State, the adjoining Partner State’s officers may carry firearms as appropriate through the control zone to the exclusive use area."}]}]}, {"n": 5, "title": "Border Clearance Procedures", "sections": [{"id": "5", "title": "Border Clearance Procedures", "blocks": [{"t": "p", "text": "This chapter sets out border clearance procedures for persons, means of transport, and goods, respectively. It also addresses alternative control modalities and exceptional situations."}]}, {"id": "5.1", "title": "Persons", "blocks": [{"t": "p", "text": "Documents that may apply for clearance processes at border, among others, include:"}, {"t": "li", "mk": "i", "lv": 2, "text": "passport, laissez-passer, or other travel document;"}, {"t": "li", "mk": "ii", "lv": 2, "text": "national identification card;"}, {"t": "li", "mk": "iii", "lv": 2, "text": "entry, exit, or transit visa;"}, {"t": "li", "mk": "iv", "lv": 2, "text": "health certificate(s); and"}, {"t": "li", "mk": "vi", "lv": 2, "text": "parent(s)’ authorization for travelling with minors."}, {"t": "h", "id": "5.1.1", "text": "Pedestrians"}, {"t": "li", "mk": "1", "lv": 1, "text": "Pedestrians shall upon arrival at the control zone of the Partner State of entry proceed in the following order to:"}, {"t": "li", "mk": "i", "lv": 2, "text": "security screening: for persons and baggage;"}, {"t": "li", "mk": "ii", "lv": 2, "text": "health screening: for health declaration and verification of the vaccination certificate;"}, {"t": "li", "mk": "iii", "lv": 2, "text": "immigration control: for exit and entry clearance;"}, {"t": "li", "mk": "iv", "lv": 2, "text": "customs (if required): for declaration of personal effects, currency, and luggage, and temporary admission or import formalities; and"}, {"t": "li", "mk": "v", "lv": 2, "text": "other partner border control agencies (if required): for other controls as the case may be."}, {"t": "li", "mk": "2", "lv": 1, "text": "After completion of the controls, the pedestrians shall proceed through the exit gate into the Partner State of immediate destination."}, {"t": "h", "id": "5.1.2", "text": "Drivers and Passengers"}, {"t": "p", "text": "Drivers and passengers shall upon arrival at the control zone of the Partner State of entry proceed as follows:"}, {"t": "li", "mk": "1", "lv": 1, "text": "Public Service Vehicles: The driver parks the vehicle in designated parking / inspection area in the control zone. The health officer may board the vehicle for health clearance and issue a certificate for free pratique for disembarkation under the International Health Regulations, 2005. At the discretion of the responsible control officers, the passengers may be required to offload their luggage and belongings, and proceed to the relevant control counters. The concerned officers may move to the vehicle and rummage it. The driver then reports to the control counters and hands over the passenger manifest and motor vehicle cargo manifest to immigration, customs, and other concerned officers."}, {"t": "li", "mk": "2", "lv": 1, "text": "Private Vehicles: Drivers of private vehicles park their vehicles in designated parking areas in the control zone. At the discretion of the responsible control officers, occupants may be required to disembark and offload their luggage and belongings, and proceed to the relevant control counters."}, {"t": "li", "mk": "3", "lv": 1, "text": "The controls/procedures are performed in the following order:"}, {"t": "li", "mk": "i", "lv": 2, "text": "security screening: for persons and baggage;"}, {"t": "li", "mk": "ii", "lv": 2, "text": "health screening: for health declaration and verification of the vaccination certificate;"}, {"t": "li", "mk": "iii", "lv": 2, "text": "the counter for immigration control: for exit and entry clearance;"}, {"t": "li", "mk": "iv", "lv": 2, "text": "the customs counter (if required): for declaration of personal effects, currency, and luggage, temporary admission or import formalities, and other controls (sanitary and phytosanitary [SPS], veterinary and other controls as the case may be);"}, {"t": "li", "mk": "v", "lv": 2, "text": "other partner border control agencies (if required): for other controls as the case may be; and"}, {"t": "li", "mk": "vi", "lv": 2, "text": "payment of duties and other fees: as may be required."}, {"t": "li", "mk": "4", "lv": 1, "text": "The inspections are ideally summary and non-intrusive. If a body search is required, the search shall be performed by an officer of the same sex."}, {"t": "li", "mk": "5", "lv": 1, "text": "A traveller and/or his/her personal effects and luggage may be referred to specially designated areas for further inspection in case of:"}, {"t": "li", "mk": "i", "lv": 2, "text": "an established or suspected irregularity (e.g., based on risk management profiling, intelligence);"}, {"t": "li", "mk": "ii", "lv": 2, "text": "random checks; and"}, {"t": "li", "mk": "iii", "lv": 2, "text": "required security, health, and compliance checks by the relevant agencies."}, {"t": "h", "id": "5.1.3", "text": "Simplified Clearance"}, {"t": "p", "text": "A simplified border control regime may apply to the following categories of travellers."}, {"t": "li", "mk": "1", "lv": 1, "text": "Border Community Residents"}, {"t": "p", "text": "Border community residents benefit from a simplified border crossing regime under the conditions agreed by the adjoining Partner States."}, {"t": "li", "mk": "2", "lv": 1, "text": "Other Categories"}, {"t": "p", "text": "Other travellers that may benefit from a simplified control regime are:"}, {"t": "li", "mk": "i", "lv": 2, "text": "citizens of EAC Partner States on the basis of the East African Community Common Market Protocol;"}, {"t": "li", "mk": "ii", "lv": 2, "text": "frequent travellers (e.g., motor vehicle crew members); and"}, {"t": "li", "mk": "iii", "lv": 2, "text": "pre-cleared travellers on the basis of advance notification and identity screening."}, {"t": "h", "id": "5.1.4", "text": "Fast Track Clearance"}, {"t": "p", "text": "Fast track clearance entails preferential treatment for the following categories of persons:"}, {"t": "li", "mk": "i", "lv": 2, "text": "VIPs and holders of diplomatic passports;"}, {"t": "li", "mk": "ii", "lv": 2, "text": "persons with special needs, such as sick persons and physically challenged persons;"}, {"t": "li", "mk": "iii", "lv": 2, "text": "persons travelling with infants; and"}, {"t": "li", "mk": "iv", "lv": 2, "text": "as may be determined by competent authorities."}, {"t": "h", "id": "5.1.5", "text": "Process Flow Chart: Persons"}, {"t": "flow", "id": "5.1"}]}, {"id": "5.2", "title": "Means of Transport", "blocks": [{"t": "p", "text": "The means of transport refers to the vehicles or conveyances used for the performance of the cross-border movement or transport operation."}, {"t": "h", "id": "5.2.1", "text": "Admission Procedure"}, {"t": "li", "mk": "1", "lv": 1, "text": "The following are documents to be used in the clearance of motor vehicles by the agency/authority concerned, among others, as applicable:"}, {"t": "li", "mk": "i", "lv": 2, "text": "registration (logbook details);"}, {"t": "li", "mk": "ii", "lv": 2, "text": "insurance (COMESA card);"}, {"t": "li", "mk": "iii", "lv": 2, "text": "driver’s license;"}, {"t": "li", "mk": "iv", "lv": 2, "text": "sanitary conditions, disinfection, and deratting;"}, {"t": "li", "mk": "v", "lv": 2, "text": "transport operator’s license; and"}, {"t": "li", "mk": "vi", "lv": 2, "text": "international road transport carnet."}, {"t": "li", "mk": "2", "lv": 1, "text": "Based on the documents in (1), the competent authority provides drivers with a temporary admission/entry/import or temporary exit/export certificate."}, {"t": "li", "mk": "3", "lv": 1, "text": "Applicable fees such as road user charges are paid in accordance with the procedures of the respective agencies."}, {"t": "li", "mk": "4", "lv": 1, "text": "The inspections are summary and non-intrusive."}, {"t": "li", "mk": "5", "lv": 1, "text": "The vehicles are directed to the verification bay or special parking areas for further inspection in case of:"}, {"t": "li", "mk": "i", "lv": 2, "text": "an established or suspected irregularity (e.g., based on risk management profiling, intelligence);"}, {"t": "li", "mk": "ii", "lv": 2, "text": "random checks; and"}, {"t": "li", "mk": "ii", "lv": 2, "text": "required security, health, and compliance checks by the relevant agencies."}, {"t": "li", "mk": "6", "lv": 1, "text": "After completion of the controls, a gate pass (paper or electronic) is issued, allowing the vehicle to exit into the Partner State of immediate destination."}, {"t": "h", "id": "5.2.2", "text": "Fast Track Clearance"}, {"t": "p", "text": "Fast track clearance entails preferential treatment for the following categories of vehicles:"}, {"t": "li", "mk": "i", "lv": 2, "text": "emergency vehicles, including ambulances, fire trucks, vehicle recovery vehicles, and rescue vehicles;"}, {"t": "li", "mk": "ii", "lv": 2, "text": "fuel tankers, including LPG, LNG, and other fuel trucks; and"}, {"t": "li", "mk": "iii", "lv": 2, "text": "as may be determined by competent authorities."}, {"t": "h", "id": "5.2.3", "text": "Simplified Clearance"}, {"t": "p", "text": "The drivers of vehicles qualifying for simplified clearance may request to use the green lane/track:"}, {"t": "li", "mk": "i", "lv": 2, "text": "open empty trucks and buses/coaches subject to summary visual verification;"}, {"t": "li", "mk": "ii", "lv": 2, "text": "empty closed compartments and containers subject to summary visual verification or passage through the scanner as the case may be; and"}, {"t": "li", "mk": "iii", "lv": 2, "text": "non-motorized vehicles."}, {"t": "h", "id": "5.2.4", "text": "Process Flow Chart: Means of Transport"}, {"t": "flow", "id": "5.2"}]}, {"id": "5.3", "title": "Goods", "blocks": [{"t": "h", "id": "5.3.1", "text": "Accompanied Luggage"}, {"t": "li", "mk": "1", "lv": 1, "text": "As a rule, the controls with respect to accompanied luggage and personal effects shall be summary and non-intrusive, on the basis of the declaration of their owner, for customs and other purposes."}, {"t": "li", "mk": "2", "lv": 1, "text": "The officers in charge of the control may order more intensive and detailed physical inspection in the designated area in case of:"}, {"t": "li", "mk": "i", "lv": 2, "text": "an established or suspected irregularity (e.g., based on risk management profiling, intelligence);"}, {"t": "li", "mk": "ii", "lv": 2, "text": "random checks; and"}, {"t": "li", "mk": "ii", "lv": 2, "text": "required security, health, and compliance checks by the relevant agencies."}, {"t": "li", "mk": "3", "lv": 1, "text": "Personal effects and luggage under the allowable value provided for by the EAC Customs Management Act are cleared under the Simplified Trade Regime."}, {"t": "h", "id": "5.3.2", "text": "Cargo Subject to Standard Control Procedures"}, {"t": "li", "mk": "1", "lv": 1, "text": "The driver of a freight vehicle parks his/her vehicle in the designated parking area in the control zone and reports to the counter of the relevant control agencies for the completion of the exit and entry border controls."}, {"t": "li", "mk": "2", "lv": 1, "text": "The driver may employ the services of a customs clearance and forwarding agent for assistance or representation in the control process."}, {"t": "li", "mk": "3", "lv": 1, "text": "Documents that may apply for clearance processes at the border, among others, include:"}, {"t": "li", "mk": "i", "lv": 2, "text": "cargo manifest/(container) packing list;"}, {"t": "li", "mk": "ii", "lv": 2, "text": "commercial or pro forma invoice;"}, {"t": "li", "mk": "iii", "lv": 2, "text": "consignment note/waybill;"}, {"t": "li", "mk": "iv", "lv": 2, "text": "certificate of origin;"}, {"t": "li", "mk": "v", "lv": 2, "text": "customs import/export/transit declaration;"}, {"t": "li", "mk": "vi", "lv": 2, "text": "import/export license/permit;"}, {"t": "li", "mk": "vii", "lv": 2, "text": "quality inspection certificate;"}, {"t": "li", "mk": "viii", "lv": 2, "text": "health/sanitary certificate;"}, {"t": "li", "mk": "ix", "lv": 2, "text": "phytosanitary/international animal health certificate;"}, {"t": "li", "mk": "x", "lv": 2, "text": "fumigation/pest control certificate;"}, {"t": "li", "mk": "xi", "lv": 2, "text": "surveyor report (specification, quantity, value);"}, {"t": "li", "mk": "xii", "lv": 2, "text": "cargo insurance certificate;"}, {"t": "li", "mk": "xiii", "lv": 2, "text": "dangerous goods declaration;"}, {"t": "li", "mk": "xiv", "lv": 2, "text": "death certificate/burial permit;"}, {"t": "li", "mk": "xv", "lv": 2, "text": "disinfection certificate; and"}, {"t": "li", "mk": "xvii", "lv": 2, "text": "release order."}, {"t": "li", "mk": "4", "lv": 1, "text": "Border clearance documents shall be processed in advance to the extent possible using a preclearance facility."}, {"t": "li", "mk": "5", "lv": 1, "text": "Cargo is subject to physical inspection based on risk analysis or intelligence. Such physical inspections should be coordinated by concerned control agencies. The owner or his/her representative for the goods declared or accompanied shall be present during an inspection in a timely manner and is required to cooperate with border agencies. The findings of the inspections shall be treated as provided by national or regional law."}, {"t": "li", "mk": "6", "lv": 1, "text": "The gate pass (paper or electronic) certifies completion of the mandatory controls,"}, {"t": "h", "id": "5.3.3", "text": "Simplified Cargo Clearance"}, {"t": "p", "text": "The following types of consignments qualify for simplified clearance:"}, {"t": "li", "mk": "i", "lv": 2, "text": "pre-cleared goods under the EAC Single Customs Territory regime;"}, {"t": "li", "mk": "ii", "lv": 2, "text": "consignments subject to post-clearance audit;"}, {"t": "li", "mk": "iii", "lv": 2, "text": "goods cleared under an Authorized Economic Operators (AEOs) program;"}, {"t": "li", "mk": "iv", "lv": 2, "text": "secured transit goods (in sealed containers or cargo compartments); and"}, {"t": "li", "mk": "v", "lv": 2, "text": "simplified trade regime goods, such as low-value goods, as provided for in the EAC Simplified Trade Regime manual."}, {"t": "h", "id": "5.3.4", "text": "Fast Track Clearance"}, {"t": "p", "text": "The importer, exporter, or declarant may make a request for fast track clearance of the following types of consignments:"}, {"t": "li", "mk": "i", "lv": 2, "text": "perishable goods (e.g., fresh and animal-origin foodstuffs, human organs, and substances);"}, {"t": "li", "mk": "ii", "lv": 2, "text": "hazardous goods (e.g., inflammables, explosives, toxic goods, radioactive goods);"}, {"t": "li", "mk": "iii", "lv": 2, "text": "livestock;"}, {"t": "li", "mk": "iv", "lv": 2, "text": "VIP luggage;"}, {"t": "li", "mk": "v", "lv": 2, "text": "diplomatic bags/pouches; and"}, {"t": "li", "mk": "vi", "lv": 2, "text": "human remains."}, {"t": "h", "id": "5.3.5", "text": "High-Risk Goods"}, {"t": "li", "mk": "1", "lv": 1, "text": "Goods substantially affecting health, safety, security, or revenue are considered high risk. Therefore, these goods are subject to intensive and detailed inspection at the border or other designated handling facility."}, {"t": "li", "mk": "2", "lv": 1, "text": "Such intensive and detailed inspections consist of respectively an exhaustive inventory and condition check. Techniques to ascertain the nature, quality, and quantity of the cargo include sampling, weighing, measuring, and counting."}, {"t": "li", "mk": "3", "lv": 1, "text": "When verification is required, either as part of a standard procedure (e.g., hazardous goods) or pursuant to an indication or suspicion of irregularity, the following procedure applies:"}, {"t": "li", "mk": "i", "lv": 2, "text": "the user is requested to park his/her vehicle, deposit his/her goods and present himself/herself in the designated area/bay of the control zone for that purpose;"}, {"t": "li", "mk": "ii", "lv": 2, "text": "the counterpart agency of the adjoining state and the other concerned agencies are informed of the intended verification and are requested to participate in their areas of concern;"}, {"t": "li", "mk": "iii", "lv": 2, "text": "a report of the verification operation is prepared by the designated officer of the participating agencies; and"}, {"t": "li", "mk": "iv", "lv": 2, "text": "the results of the verification operation shall be shared and exchanged among the OSBP-concerned agencies, through the issuance of certified copies of the verification report or via uploading in a database that is accessible on a read-only basis."}, {"t": "h", "id": "5.3.6", "text": "Transshipment within the Control Zone"}, {"t": "li", "mk": "1", "lv": 1, "text": "The transport operators of the vehicle from which items are to be offloaded and loaded onto another vehicle shall inform in advance, either directly or through their facilitation agents, the competent authorities of the exit and entry Partner State, of the transshipment operation."}, {"t": "li", "mk": "2", "lv": 1, "text": "At the time of the transshipment operation, the drivers of the vehicles to be offloaded and loaded, park their vehicles in the designated special parking area or other place authorized by the officer in charge, and report to the counter(s) of the relevant control authorities."}, {"t": "li", "mk": "3", "lv": 1, "text": "The border clearance application shall be made by any person responsible for the cargo to be offloaded or loaded, or by the facilitation agent."}, {"t": "li", "mk": "4", "lv": 1, "text": "Any specialized assistance required for the physical performance of the transshipment operation shall be provided by facilitation agents or other authorized service providers."}, {"t": "li", "mk": "5", "lv": 1, "text": "After completion of the border clearance control for the cargo, the offloaded vehicle leaves the control zone to the exit Partner State or as shall be directed by the officer responsible for the transshipment."}, {"t": "h", "id": "5.3.7", "text": "Storage and Disposal of Goods"}, {"t": "p", "text": "In case goods must be stored or disposed of in the control zone, the responsibility remains with the customs authority with jurisdiction."}, {"t": "h", "id": "5.3.8", "text": "Process Flow Chart: Clearance of Goods"}, {"t": "flow", "id": "5.3"}]}, {"id": "5.4", "title": "Alternative Control Modalities", "blocks": [{"t": "h", "id": "5.4.1", "text": "Inter-State"}, {"t": "p", "text": "One of the following modalities may be applied between the authorities of the adjoining Partner States:"}, {"t": "li", "mk": "i", "lv": 2, "text": "The exit Partner State relies on the controls by the entry Partner State. Such an arrangement may be agreed by the adjoining Partner States in a bilateral agreement."}, {"t": "li", "mk": "ii", "lv": 2, "text": "The agencies of the adjoining Partner States perform their border controls together at the same place and time. The clearance procedure is performed with close collaboration of the authorities of the adjoining entry and exit Partner States. The exit and entry control measures of the adjoining Partner States are implemented together so as to be effected in a single operation."}, {"t": "h", "id": "5.4.2", "text": "Inter-Agency"}, {"t": "p", "text": "Between the agencies of the different control fields one of the following modalities may be applied:"}, {"t": "li", "mk": "i", "lv": 2, "text": "all agencies are merged and integrated into a single entity, responsible for control in the various fields; or"}, {"t": "li", "mk": "ii", "lv": 2, "text": "the respective concerned agencies delegate their control authority to a specific agency that performs the controls also on their behalf; or"}, {"t": "li", "mk": "iii", "lv": 2, "text": "the respective agencies perform their controls together at the same place and time."}, {"t": "h", "id": "5.4.3", "text": "Single Window"}, {"t": "li", "mk": "1", "lv": 1, "text": "An efficient modality to implement joint and simultaneous border control is the single window technique, since it allows to integrate into a single operation the controls of the respective agencies, even of the adjoining Partner States."}, {"t": "li", "mk": "2", "lv": 1, "text": "Single window implementation may be achieved manually or electronically (i.e., through computer software)."}, {"t": "p", "text": "Schematic of an Electronic Single Window"}, {"t": "p", "text": "Sources: (i) Organization for Security and Co-operation in Europe and United Nations Economic Commission for Europe, Handbook of Best Practices at Border Crossings –"}, {"t": "p", "text": "A Trade and Transport Facilitation Perspective, 2012, Diagram 7.2, p. 182 [downloadable from http://www.osce.org/eea/ 88238?download=true]; and (ii) Asian Development Bank and ADB Institute, Connecting South Asia and Southeast Asia, 2015, p. 194 [modified for the EAC context]"}]}, {"id": "5.5", "title": "Exceptional Situations", "blocks": [{"t": "h", "id":
